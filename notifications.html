<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Shop shell ---------- */
.announcement{background:var(--forest-900);color:#fff;text-align:center;font-size:12px;font-weight:500;padding:8px 16px}
.site-header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-inner{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink-900);white-space:nowrap}
.desktop-nav{display:none;gap:20px;font-weight:500}
.desktop-nav a{padding:4px 0;border-bottom:2px solid transparent}
.desktop-nav a:hover,.desktop-nav a.active{border-color:var(--forest-700);color:var(--ink-900)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.icon-link{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r-pill);background:none;border:0;cursor:pointer;color:var(--ink-900);font:inherit;font-size:13px}
.icon-link:hover{background:var(--cream-100)}
.icon-link i{font-size:16px}
.icon-link .lbl{display:none}
.badge-dot{background:var(--forest-700);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.container.narrow{max-width:800px}
.site-footer{border-top:1px solid var(--border);padding:24px 20px;text-align:center;font-size:12px;color:var(--ink-500)}
.site-footer a{margin:0 8px;text-decoration:underline}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:var(--tabbar);background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:60}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-500);flex:1;padding:6px 0;background:none;border:0;cursor:pointer}
.tabbar i{font-size:17px}.tabbar .active{color:var(--forest-700);font-weight:700}
body.has-tabbar{padding-bottom:var(--tabbar)}

/* ---------- Notification Specific Elements ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-1);display:flex;gap:14px;align-items:flex-start}
.card.unread{background:var(--mint-50);border-color:var(--sage-300)}
.notif-icon{width:36px;height:36px;border-radius:50%;background:var(--mint-100);color:var(--forest-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 13px var(--font-body);cursor:pointer;transition:.2s}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}

@media(min-width:900px){
  .desktop-nav{display:flex}
  .icon-link .lbl{display:inline}
  .tabbar{display:none}body.has-tabbar{padding-bottom:0}
  .container{padding:32px}
}
</style>
</head>
<body data-layout="shop" data-section="notifications">
<main class="container narrow" id="main">
  <div class="row-between page-head" style="margin-bottom:20px">
    <div>
      <h1>Notifications</h1>
      <p class="muted" style="margin-top:4px">Updates regarding your orders and quotes.</p>
    </div>
    <button class="btn outline sm" id="markAll" type="button">Mark all as read</button>
  </div>
  
  <div class="stack" id="notifList">
    <div class="empty">Loading notifications...</div>
  </div>
</main>

<script>
(function () {
  const body = document.body;
  const SHOP_NAV = [['Shop', 'shop.html', 'shop'], ['Wholesale', 'wholesale.html', 'wholesale'], ['Supply request', 'supply-request.html', 'supply']];
  const SHOP_TABS = [
    ['Home', 'index.html', 'home', 'fa-solid fa-house'], ['Shop', 'shop.html', 'shop', 'fa-solid fa-store'],
    ['Orders', 'my-orders.html', 'orders', 'fa-solid fa-box-archive'], ['Messages', 'chat.html', 'messages', 'fa-regular fa-comment-dots'],
    ['Account', 'account.html', 'account', 'fa-regular fa-user']
  ];
  const links = arr => arr.map(([t, h, k]) => `<a href="${h}" class="${k === 'notifications' ? 'active' : ''}">${t}</a>`).join('');
  const tabs = arr => arr.map(([t, h, k, i]) => `<a href="${h}" class="${k === 'notifications' ? 'active' : ''}"><i class="${i}"></i><span>${t}</span></a>`).join('');

  body.classList.add('has-tabbar');
  body.insertAdjacentHTML('afterbegin', `
    <div class="announcement">Free delivery in Abuja over ₦50,000</div>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="brand">OMAK Store</a>
        <nav class="desktop-nav">${links(SHOP_NAV)}</nav>
        <div class="header-actions">
          <a class="icon-link active" href="notifications.html" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="badge-dot" id="notifBadge" style="display:none">0</span></a>
          <a class="icon-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="lbl">Cart</span></a>
          <a class="icon-link desktop-only" href="account.html"><i class="fa-regular fa-user"></i><span class="lbl">Account</span></a>
        </div>
      </div>
    </header>
  `);
  
  document.getElementById('main').insertAdjacentHTML('afterend', `
    <footer class="site-footer desktop-only">
      <a href="support.html">Help &amp; support</a><a href="my-quotes.html">My quotes</a><a href="wishlist.html">Saved items</a><a href="staff-login.html">Staff portal</a>
      <p style="margin-top:8px">© OMAK Store · Abuja, Nigeria</p>
    </footer>
    <nav class="tabbar mobile-only">${tabs(SHOP_TABS)}</nav>
  `);
})();

document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const listEl = document.getElementById('notifList');

  if (!sb) {
    listEl.innerHTML = '<div class="empty">Database client unavailable.</div>';
    return;
  }

  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    location.href = 'signin.html';
    return;
  }

  async function fetchNotifications() {
    try {
      // Fetch notifications belonging to this user (or global system notes where user_id is null)
      const { data, error } = await sb
        .from('notifications')
        .select('*')
        .or(`user_id.eq.${user.id},user_id.is.null`)
        .order('created_at', { ascending: false });

      if (error) throw error;
      renderNotifications(data || []);
    } catch (err) {
      console.error('Error loading notifications:', err);
      listEl.innerHTML = '<div class="empty">No notifications found.</div>';
    }
  }

  function renderNotifications(items) {
    if (!items.length) {
      listEl.innerHTML = '<div class="empty"><h3>All caught up!</h3><p style="margin-top:6px">You have no new notifications right now.</p></div>';
      return;
    }

    listEl.innerHTML = items.map(n => {
      const isUnread = n.is_read === false;
      const dateStr = n.created_at ? new Date(n.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      return `
        <div class="card ${isUnread ? 'unread' : ''}" data-id="${n.id}">
          <div class="notif-icon"><i class="fa-solid fa-bell"></i></div>
          <div style="flex:1">
            <div class="row-between">
              <h3 style="font-size:1rem">${n.title || 'Notification'}</h3>
              <span class="small muted">${dateStr}</span>
            </div>
            <p style="margin-top:4px;color:var(--ink-700)">${n.message || ''}</p>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('markAll').addEventListener('click', async () => {
    try {
      await sb
        .from('notifications')
        .update({ is_read: true })
        .eq('user_id', user.id);
      fetchNotifications();
    } catch (err) {
      console.error('Error marking notifications read:', err);
    }
  });

  fetchNotifications();
});
</script>
</body>
</html>
