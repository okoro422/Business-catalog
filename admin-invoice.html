<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<style>
/* Business Catalog - ONE shared stylesheet for every page */
body{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Buttons & Cards ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- Tables ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}.line.total{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}

/* ---------- Admin Shell Layout ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}.admin-content{padding:28px 32px}
}
@media print{
  .admin-side,.admin-top,.btn-row{display:none!important}
  body{background:#fff}
  .admin-content{padding:0}
}
</style>
</head>
<body data-layout="admin" data-section="orders" data-title="Invoice" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html" class="active">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Order Invoice</strong>
      <a href="admin-orders.html" class="small muted">← Back to Orders</a>
    </header>

    <main class="admin-content" id="main">
      <div id="inv" class="stack">
        <div class="muted" style="text-align:center;padding:40px">Loading invoice...</div>
      </div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const root = document.getElementById('inv');
  const orderId = new URLSearchParams(location.search).get('id');

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  const naira = n => '₦' + Math.round(n || 0).toLocaleString('en-NG');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  if (!sb || !orderId) {
    root.innerHTML = '<div class="empty"><h2>Order ID or Database missing</h2><a class="btn" href="admin-orders.html">Back to Orders</a></div>';
    return;
  }

  try {
    // 1. Fetch order details from Supabase
    const { data: order, error: orderErr } = await sb.from('orders').select('*').eq('id', orderId).single();
    if (orderErr || !order) throw new Error('Order not found');

    // 2. Fetch associated order items from Supabase 'order_items' table
    const { data: items, error: itemsErr } = await sb.from('order_items').select('*').eq('order_id', orderId);
    if (itemsErr) throw itemsErr;

    const fee = order.delivery_fee || order.fee || 0;
    const total = order.total || 0;
    const tableRows = (items || []).map(i => {
      const qty = i.qty || 1;
      const unitPrice = i.unit_price || 0;
      const lineTotal = i.line_total != null ? i.line_total : unitPrice * qty;
      return `<tr><td>${esc(i.name || 'Item')}</td><td>${qty}</td><td>${naira(unitPrice)}</td><td>${naira(lineTotal)}</td></tr>`;
    });

    root.innerHTML = `
      <div class="row-between">
        <div>
          <h1>Invoice INV-${esc(order.id)}</h1>
          <p class="muted">${esc(order.customer_name || order.customer || 'Customer')} · due in 14 days · <a href="admin-order-details.html?id=${encodeURIComponent(order.id)}" style="text-decoration:underline">Order #${esc(order.id)}</a></p>
        </div>
        <a class="muted" href="admin-orders.html">← All orders</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Total</th></tr></thead>
          <tbody>${tableRows.length > 0 ? tableRows.join('') : '<tr><td colspan="4" style="text-align:center">No line items recorded</td></tr>'}</tbody>
        </table>
      </div>
      <div class="card stack" style="gap:6px">
        ${Number(order.discount || 0) ? `<div class="line"><span>Discount</span><span>−${naira(order.discount)}</span></div>` : ''}
        <div class="line"><span>Delivery fee</span><span>${naira(fee)}</span></div>
        <div class="line total"><span>TOTAL</span><span>${naira(total)}</span></div>
        <p class="small muted">Bank details: OMAK Resources Nig · GTBank: 0123456789</p>
      </div>
      <div class="btn-row">
        <button class="btn" type="button" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Invoice</button>
        <button class="btn outline" id="sendChatBtn" type="button"><i class="fa-regular fa-comment-dots"></i> Send in chat</button>
      </div>
    `;

    document.getElementById('sendChatBtn').addEventListener('click', async () => {
      try {
        if (!order.user_id) throw new Error('This order is not linked to a customer account.');
        const { data: { user: staff }, error: authError } = await sb.auth.getUser();
        if (authError) throw authError;
        if (!staff) throw new Error('Your staff session has expired. Please sign in again.');

        let { data: thread, error: threadError } = await sb
          .from('chat_threads')
          .select('id')
          .eq('customer_id', order.user_id)
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();
        if (threadError) throw threadError;
        if (!thread) {
          const result = await sb.from('chat_threads')
            .insert({ customer_id: order.user_id, subject: 'Support chat' })
            .select('id')
            .single();
          if (result.error) throw result.error;
          thread = result.data;
        }

        const { error } = await sb.from('messages').insert({
          thread_id: thread.id,
          sender_id: staff.id,
          kind: 'staff',
          body: `Invoice INV-${order.id} amounting to ${naira(total)} has been generated and sent.`
        });
        if (error) throw error;
        toast('Invoice sent in chat successfully!');
      } catch (err) {
        console.error('Failed to send invoice in chat:', err);
        toast('Failed to send invoice: ' + (err.message || 'unknown error'));
      }
    });

  } catch (err) {
    console.error('Error loading invoice:', err);
    root.innerHTML = '<div class="empty"><h2>Could not load invoice details</h2><a class="btn" href="admin-orders.html">Back to Orders</a></div>';
  }
});
</script>
</body>
</html>
