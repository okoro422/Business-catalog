<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="payment-ui.js"></script>

<style>
body{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Layout & Elements ---------- */
.announcement{background:var(--forest-900);color:#fff;text-align:center;font-size:12px;font-weight:500;padding:8px 16px}
.site-header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-inner{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink-900);white-space:nowrap}
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.container.narrow{max-width:900px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.price{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}

/* Pills & Badges */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.pill{background:var(--cream-100);border:1px solid var(--border);color:var(--ink-500);padding:8px 16px;border-radius:var(--r-pill);font:600 12px var(--font-body);white-space:nowrap;cursor:pointer;transition:.2s}
.pill.active{background:var(--forest-700);border-color:var(--forest-700);color:#fff}
.badge{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--mint-100);color:var(--forest-700);border:1px solid var(--sage-300)}
.badge.warn{background:#FEF3C7;color:#92400E;border-color:#F5DFA0}
.badge.danger{background:#FBE7E3;color:var(--danger);border-color:#F0C4BC}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s}
.btn:hover{background:var(--forest-800)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.steps{display:flex;gap:10px;overflow-x:auto}
.step{white-space:nowrap;font-size:12px;color:var(--ink-500)}.step.active{color:var(--ink-900);font-weight:700}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}
.field input{width:100%;padding:10px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;outline:none}
.bank-payment{margin:12px 0}.bank-payment h3{margin-bottom:8px}.bank-account-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin:12px 0}.bank-account{display:grid;gap:6px;padding:14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--cream-50)}.bank-account-number{font-size:1.35rem;font-weight:700;letter-spacing:.04em;color:var(--forest-900)}.proof-label{display:block;margin:12px 0 6px;font-weight:600}.payment-error{color:var(--danger);margin-top:8px}
</style>
</head>
<body data-layout="shop" data-section="orders">
<main class="container narrow" id="main">
  <div class="row-between page-head">
    <h1>My Orders</h1>
    <div class="field" style="min-width:200px"><input id="q" type="search" placeholder="Search order number"></div>
  </div>
  <div class="pills" id="pills">
    <button type="button" class="pill active" data-f="all">All</button>
    <button type="button" class="pill" data-f="Placed">Placed</button>
    <button type="button" class="pill" data-f="Processing">Processing</button>
    <button type="button" class="pill" data-f="Dispatched">Dispatched</button>
    <button type="button" class="pill" data-f="Delivered">Delivered</button>
    <button type="button" class="pill" data-f="Unpaid credit">Unpaid credit</button>
  </div>
  <div class="stack" id="list">
    <div class="empty">Loading your orders...</div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const STEPS = ['Placed', 'Confirmed', 'Packed', 'Out for delivery', 'Delivered'];
  let f = 'all', q = '', open = null, ordersList = [], loadError = '', currentUser = null;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const badge = s => `<span class="badge ${s === 'Delivered' ? '' : s === 'Cancelled' ? 'danger' : 'warn'}">${s}</span>`;

  function detail(o) {
    const at = STEPS.indexOf(o.status === 'New' ? 'Placed' : o.status);
    const items = o.items || [];
    return `<div class="stack" style="gap:10px;border-top:1px solid var(--border);padding-top:12px">
      <div class="steps">${STEPS.map((s, i) => `<span class="step ${i <= at ? 'active' : ''}">${i + 1} ${s}</span>`).join('')}</div>
      ${items.map(i => `<div class="line"><span>${i.qty} × ${esc(i.name)}</span><strong>${naira(i.total || i.line_total || i.unit_price * i.qty)}</strong></div>`).join('')}
      <div class="line"><span>Delivery</span><strong>${o.fee ? naira(o.fee) : 'Free'}</strong></div>
      ${window.BCPayment.renderOrderPayment(o)}
      <div class="btn-row" style="margin:0">
        <a class="btn sm outline" href="chat.html">Message us</a>
        ${['Placed', 'Confirmed'].includes(o.status) ? `<a class="btn sm outline" href="cancel-order.html?id=${encodeURIComponent(o.id)}&amp;type=cancel">Cancel order</a>` : ''}
        ${o.status === 'Delivered' ? `<a class="btn sm outline" href="cancel-order.html?id=${encodeURIComponent(o.id)}&amp;type=return">Return items</a>` : ''}
      </div></div>`;
  }

  function render() {
    const filtered = ordersList.filter(o => {
      const matchesStatus = f === 'all' ||
        (f === 'Placed' && ['Placed', 'New'].includes(o.status)) ||
        (f === 'Processing' && ['Confirmed', 'Packed'].includes(o.status)) ||
        (f === 'Dispatched' && o.status === 'Out for delivery') ||
        (f === 'Delivered' && o.status === 'Delivered') ||
        (f === 'Unpaid credit' && o.payment_method === 'credit' && !['paid', 'succeeded'].includes(String(o.payment_status || '').toLowerCase()));
      return matchesStatus &&
      (!q || o.id.toLowerCase().includes(q))
    });

    document.getElementById('list').innerHTML = loadError
      ? `<div class="empty"><h3>We couldn't load your orders</h3><p>${esc(loadError)}</p><button class="btn" type="button" onclick="location.reload()">Try again</button></div>`
      : filtered.length ? filtered.map(o => `<div class="card stack" style="gap:12px">
      <div class="row-between">
        <div><div class="price">#${esc(o.id.slice(0, 8))}</div><div class="small muted">${date(o.date)} · ${esc(o.area || '')}</div></div>
        <div>${badge(o.status)} <span class="badge ${String(o.payment_status || '').toLowerCase() === 'paid' ? '' : 'warn'}">${esc(o.payment_status || o.payment_method || 'Payment pending')}</span></div>
      </div>
      <div class="row-between">
        <span class="price">${naira(o.total)}</span>
        <span class="small muted">${(o.items || []).length} item${(o.items || []).length === 1 ? '' : 's'}</span>
      </div>
      <div class="btn-row" style="margin:0">
          <a class="btn sm" href="order-details.html?id=${encodeURIComponent(o.id)}">Details</a>
          <a class="btn sm outline" href="order-details.html?id=${encodeURIComponent(o.id)}&amp;print=1">Receipt</a>
          <button class="btn sm" type="button" data-track="${esc(o.id)}">${open === o.id ? 'Hide' : 'Track'}</button>
          <button class="btn sm outline" type="button" data-reorder="${esc(o.id)}">Reorder</button>
      </div>
      ${open === o.id ? detail(o) : ''}</div>`).join('')
      : '<div class="empty"><h3>No orders found</h3><p style="margin:8px 0 18px">Your live Supabase orders will show up here.</p><a class="btn" href="shop.html">Start shopping</a></div>';
  }

  async function fetchOrders() {
    if (!sb) {
      ordersList = [];
      loadError = 'The database connection is unavailable. Check your connection and try again.';
      render();
      return;
    }

    try {
      const { data: { session }, error: authError } = await sb.auth.getSession();
      if (authError) throw authError;
      const user = session && session.user;
      if (!user) {
        location.href = 'signin.html';
        return;
      }
      currentUser = user;

      const { data, error } = await sb
        .from('orders')
        .select('*, items:order_items(*)')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error) throw error;
      loadError = '';
           ordersList = (data || []).map(o => Object.assign({}, o, { id: String(o.id), date: o.created_at, fee: o.delivery_fee, items: o.items || [] }));
    } catch (err) {
      console.error('Error fetching live orders:', err);
      ordersList = [];
      loadError = err.message || 'Please try again.';
    }
    render();
    window.BCPayment.bind(document.getElementById('list'), sb, currentUser, id => ordersList.find(order => order.id === id));
  }

  fetchOrders();

  document.getElementById('pills').addEventListener('click', e => { 
    const b = e.target.closest('.pill'); 
    if (b) { 
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      b.classList.add('active');
      f = b.dataset.f; 
      render(); 
    } 
  });

  document.getElementById('q').addEventListener('input', e => { 
    q = e.target.value.trim().toLowerCase(); 
    render(); 
  });

  document.getElementById('list').addEventListener('click', e => {
    const t = e.target.closest('[data-track]'); 
    if (t) { open = open === t.dataset.track ? null : t.dataset.track; render(); return; }
    const reorder = e.target.closest('[data-reorder]');
    if (reorder) {
      const order = ordersList.find(item => item.id === reorder.dataset.reorder);
      if (!order) return;
      try {
        const cart = JSON.parse(localStorage.getItem('bc_cart') || '[]');
        let added = 0;
        (order.items || []).forEach(item => {
          if (!item.product_id) return;
          const suffix = String(item.name || '').match(/ · (Dozen|48 pcs|Carton)$/);
          const packSize = suffix ? ({Dozen:12,'48 pcs':48,Carton:96}[suffix[1]]) : 1;
          const mode = suffix ? 'wholesale' : 'single';
          const id = String(item.product_id);
          const key = `${id}|${mode}`;
          const qty = Number(item.qty || 1) * packSize;
          const price = Number(item.unit_price || 0) / packSize;
          const line = cart.find(itemLine => itemLine.key === key);
          if (line) line.qty += qty;
          else cart.push({ key, id, mode, qty, price });
          added += 1;
        });
        if (!added) {
          toast('These order items are not linked to products that can be reordered.');
          return;
        }
        localStorage.setItem('bc_cart', JSON.stringify(cart));
        location.href = 'cart.html';
      } catch (error) {
        console.error('Could not reorder items:', error);
        toast('Could not add these items to your cart.');
      }
    }
  });
});
</script>
</body>
</html>
