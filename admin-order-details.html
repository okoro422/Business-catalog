<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- UI Elements ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn.block{width:100%}.btn.sm{padding:7px 14px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.split{display:grid;gap:24px;grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field textarea,.field select{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none}
.steps{display:flex;gap:10px;overflow-x:auto}
.step{white-space:nowrap;font-size:12px;color:var(--ink-500)}.step.active{color:var(--ink-900);font-weight:700}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}.line.total{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}

/* ---------- Admin Shell Layout ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}.admin-content{padding:28px 32px}
  .split.sidebar-right{grid-template-columns:1fr 340px;align-items:start}
}
@media print{
  .admin-side,.admin-top,.btn-row{display:none!important}
  body{background:#fff}
  .admin-content{padding:0}
}
</style>
</head>
<body data-layout="admin" data-section="orders" data-title="Order Details" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html" class="active">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Order Details</strong>
      <a href="admin-orders.html" class="small muted">← All Orders</a>
    </header>

    <main class="admin-content" id="main">
      <div id="od" class="stack">
        <div class="muted" style="text-align:center;padding:40px">Loading order details from database...</div>
      </div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const root = document.getElementById('od');
  const orderId = new URLSearchParams(location.search).get('id');

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  const naira = n => '₦' + Math.round(n || 0).toLocaleString('en-NG');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  
  const STATUSES = ['Placed', 'Confirmed', 'Packed', 'Out for delivery', 'Delivered'];
  const NEXT_MAP = {
    'Placed': 'Confirm order',
    'Confirmed': 'Pack order',
    'Packed': 'Send out delivery',
    'Out for delivery': 'Mark delivered'
  };

  if (!sb || !orderId) {
    root.innerHTML = '<div class="empty"><h2>Order ID or Database missing</h2><a class="btn" href="admin-orders.html">Back to Orders</a></div>';
    return;
  }

  try {
    // 1. Fetch Order live from Supabase 'orders' table
    const { data: order, error: orderErr } = await sb.from('orders').select('*').eq('id', orderId).single();
    if (orderErr || !order) throw new Error('Order not found');

    // 2. Fetch associated items from Supabase 'order_items' table
    const { data: items } = await sb.from('order_items').select('*').eq('order_id', orderId);

    // 3. Fetch staff notes and assigned rider metadata from Supabase 'order_staff_data' table
    const { data: staffData } = await sb.from('order_staff_data').select('*').eq('order_id', orderId).maybeSingle();

    let currentStatus = (order.status === 'New' ? 'Placed' : order.status) || 'Placed';
    let internalNote = (staffData && staffData.notes) || '';
    let assignedRider = (staffData && staffData.rider) || '';

    function draw() {
      const at = STATUSES.indexOf(currentStatus);
      const itemRows = (items || []).map(i => {
        const qty = i.quantity || i.qty || 1;
        const price = i.price || (i.total ? i.total / qty : 0);
        return `<div class="line"><span>${qty} × ${esc(i.product_name || i.name || 'Item')}</span><strong>${naira(price * qty)}</strong></div>`;
      }).join('');

      root.innerHTML = `
        <div class="row-between" style="margin-bottom:16px">
          <div><h1>Order #${esc(order.id)}</h1><p class="muted">Status: ${esc(currentStatus)}</p></div>
          <a class="muted" href="admin-orders.html">← All orders</a>
        </div>
        <div class="card"><div class="steps">${STATUSES.map((x, i) => `<span class="step ${i <= at ? 'active' : ''}">${i + 1} ${esc(x)}</span>`).join('')}</div></div>
        <div class="split sidebar-right" style="margin-top:20px">
          <div class="stack">
            <div class="card">
              ${itemRows || '<div class="muted">No items recorded</div>'}
              <div class="line"><span class="muted">Delivery Fee</span><span>${naira(order.delivery_fee || order.fee || 0)}</span></div>
              <div class="line total"><span>Total</span><span>${naira(order.total || 0)}</span></div>
            </div>
            <div class="card field">
              <label for="note">Internal notes</label>
              <textarea id="note" rows="3" placeholder="Add note...">${esc(internalNote)}</textarea>
              <button class="btn sm outline" id="saveNote" style="align-self:flex-start;margin-top:6px">Save note</button>
            </div>
            <div class="card stack" style="gap:4px">
              <strong>${esc(order.customer_name || order.customer || 'Customer')} · ${esc(order.tier || 'Retail')}</strong>
              <span>Zone ${esc(order.zone_code || order.zone || 'A')} · ${esc(order.area || '')}</span>
              <span>Payment: ${esc(order.payment_method || order.pay || 'Online')}</span>
              <div class="field" style="margin-top:8px">
                <label for="rider">Assigned Rider</label>
                <select id="rider">
                  <option value="">Assign rider</option>
                  ${['Musa', 'Emeka', 'Yusuf'].map(r => `<option ${assignedRider === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>
          <div class="stack" style="gap:12px">
            <button class="btn block" id="next" ${NEXT_MAP[currentStatus] ? '' : 'disabled'}>${NEXT_MAP[currentStatus] || 'Delivered ✓'}</button>
            <a class="btn outline block" href="admin-inbox.html">Open chat</a>
            <a class="btn outline block" href="admin-invoice.html?id=${esc(order.id)}">View invoice</a>
            <button class="btn outline block" onclick="window.print()">Print packing slip</button>
          </div>
        </div>
      `;

      // Live event handlers updating database directly
      document.getElementById('next').onclick = async () => {
        if (at < STATUSES.length - 1) {
          currentStatus = STATUSES[at + 1];
          await sb.from('orders').update({ status: currentStatus }).eq('id', orderId);
          toast('Order status updated!');
          draw();
        }
      };

      document.getElementById('saveNote').onclick = async () => {
        internalNote = document.getElementById('note').value;
        await sb.from('order_staff_data').upsert({ order_id: orderId, notes: internalNote, rider: assignedRider });
        toast('Internal note saved!');
      };

      document.getElementById('rider').onchange = async e => {
        assignedRider = e.target.value;
        await sb.from('order_staff_data').upsert({ order_id: orderId, notes: internalNote, rider: assignedRider });
        toast('Rider assigned successfully!');
      };
    }

    draw();
  } catch (err) {
    console.error('Error loading order details:', err);
    root.innerHTML = '<div class="empty"><h2>Could not load order details</h2><a class="btn" href="admin-orders.html">Back to Orders</a></div>';
  }
});
</script>
</body>
</html>
