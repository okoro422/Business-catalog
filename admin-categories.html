<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
h1{font-family:var(--font-display);color:var(--ink-900);font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2)}

/* Admin Shell Layout */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

/* Elements */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.form-grid{display:grid;gap:14px;grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field input,.field select{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s}
.btn:hover{background:var(--forest-800)}
.sub-section-links{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--cream-100);border:1px solid var(--border);color:var(--ink-500);padding:8px 16px;border-radius:var(--r-pill);font:600 12px var(--font-body);text-decoration:none}
.pill.active{background:var(--forest-700);border-color:var(--forest-700);color:#fff}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}
.line.child{padding-left:22px}
.link-danger{background:none;border:0;color:var(--danger);font:600 12px var(--font-body);cursor:pointer;text-decoration:underline}

@media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.admin-side{display:block}.admin-top{padding:16px 32px}.admin-content{padding:28px 32px}}
</style>
</head>
<body data-layout="admin" data-section="settings" data-title="Settings" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html" class="active">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Categories Management</strong>
      <a href="index.html" class="small muted">View Store →</a>
    </header>

    <main class="admin-content" id="main">
      <h1>Categories</h1>
      <div class="sub-section-links">
        <a class="pill" href="admin-delivery-zones.html">Delivery zones</a>
        <a class="pill active" href="admin-categories.html">Categories</a>
        <a class="pill" href="admin-staff.html">Staff</a>
        <a class="pill" href="admin-activity-log.html">Activity log</a>
      </div>

      <div class="card tree" id="tree">
        <div class="muted" style="text-align:center">Loading categories from database...</div>
      </div>

      <form class="card form-grid" id="form">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" placeholder="Category name" required>
        </div>
        <div class="field">
          <label for="slug">Slug</label>
          <input id="slug" placeholder="category-slug" required>
        </div>
        <div class="field">
          <label for="parent">Parent Slug</label>
          <select id="parent">
            <option value="">None (Top Level)</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">Sort Order</label>
          <input id="sort" type="number" placeholder="0" value="0">
        </div>
        <div class="field full">
          <label for="desc">Description</label>
          <input id="desc" placeholder="Short description">
        </div>
        <div class="full">
          <button class="btn" type="submit">Save Category</button>
        </div>
      </form>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  let categories = [];

  // Initialize Supabase client
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  const slugify = s => s.toLowerCase().trim().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  async function fetchCategories() {
    if (!sb) {
      $('tree').innerHTML = '<div class="muted" style="text-align:center">Database client unavailable.</div>';
      return;
    }
    try {
      const { data, error } = await sb.from('categories').select('*').order('sort_order', { ascending: true, nullsLast: true });
      if (error) throw error;
      categories = data || [];
      render();
    } catch (err) {
      console.error('Error fetching categories:', err);
      $('tree').innerHTML = '<div class="text-danger" style="text-align:center">Failed to load categories from database.</div>';
    }
  }

  function render() {
    const topLevel = categories.filter(c => !c.parent_slug);
    
    if (categories.length === 0) {
      $('tree').innerHTML = '<div class="muted" style="text-align:center">No categories found.</div>';
    } else {
      $('tree').innerHTML = topLevel.map(c => {
        const children = categories.filter(x => x.parent_slug === c.slug);
        return `
          <div class="line">
            <span><strong>${esc(c.name)}</strong> <small class="muted">(${esc(c.slug)})</small></span>
            <button class="link-danger" data-del="${esc(c.slug)}">Delete</button>
          </div>
          ${children.map(child => `
            <div class="line child">
              <span>↳ ${esc(child.name)} <small class="muted">(${esc(child.slug)})</small></span>
              <button class="link-danger" data-del="${esc(child.slug)}">Delete</button>
            </div>
          `).join('')}
        `;
      }).join('');
    }

    $('parent').innerHTML = '<option value="">None (Top Level)</option>' + 
      categories.map(c => `<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join('');
  }

  $('name').addEventListener('input', e => { 
    if (!$('slug').dataset.edited) {
      $('slug').value = slugify(e.target.value); 
    }
  });
  $('slug').addEventListener('input', e => e.target.dataset.edited = 1);

  $('form').addEventListener('submit', async e => { 
    e.preventDefault(); 
    if (!sb) return;

    try {
      const { error } = await sb.from('categories').insert([{
        slug: slugify($('slug').value),
        name: $('name').value.trim(),
        parent_slug: $('parent').value || null,
        sort_order: parseInt($('sort').value) || 0,
        description: $('desc').value.trim() || null
      }]);

      if (error) throw error;

      toast('Category saved successfully');
      e.target.reset(); 
      $('sort').value = '0';
      $('slug').dataset.edited = ''; 
      fetchCategories();
    } catch (err) {
      console.error('Error saving category:', err);
      toast('Error: Slug might already exist');
    }
  });

  $('tree').addEventListener('click', async e => { 
    const b = e.target.closest('[data-del]'); 
    if (b && confirm('Delete this category?')) { 
      try {
        const { error } = await sb.from('categories').delete().eq('slug', b.dataset.del);
        if (error) throw error;
        toast('Category deleted');
        fetchCategories();
      } catch (err) {
        console.error('Error deleting category:', err);
        toast('Failed to delete category');
      }
    } 
  });

  fetchCategories();
});
</script>
</body>
</html>
