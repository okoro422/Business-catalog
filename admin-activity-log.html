<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Log — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.text-danger{color:var(--danger)}

/* ---------- Admin Shell Layout ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-top .t{font-weight:700;color:var(--ink-900)}
.admin-top .u{display:flex;gap:14px;font-size:12px;color:var(--ink-500);flex-wrap:wrap;justify-content:flex-end}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

/* ---------- Elements ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.pill{background:var(--cream-100);border:1px solid var(--border);color:var(--ink-500);padding:8px 16px;border-radius:var(--r-pill);font:600 12px var(--font-body);white-space:nowrap;cursor:pointer;transition:.2s}
.pill.active{background:var(--forest-700);border-color:var(--forest-700);color:#fff}
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
.sub-section-links{display:flex;gap:8px;flex-wrap:wrap}

@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}.admin-content{padding:28px 32px}
}
</style>
</head>
<body data-layout="admin" data-section="settings" data-title="Settings">
<main id="main">
  <h1>Activity log</h1>
  <div class="sub-section-links">
    <a class="pill" href="admin-delivery-zones.html">Delivery zones</a>
    <a class="pill" href="admin-categories.html">Categories</a>
    <a class="pill" href="admin-staff.html">Staff</a>
    <a class="pill active" href="admin-activity-log.html">Activity log</a>
  </div>
  <div class="pills" id="pills" style="margin:16px 0 0"></div>
  <div class="table-wrap" style="margin-top:16px">
    <table>
      <thead>
        <tr><th>Time</th><th>Staff</th><th>Action</th><th>Item</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="muted" style="text-align:center;padding:20px">Loading activity log...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
(function () {
  const body = document.body;
  const layout = body.dataset.layout || 'shop';
  const section = body.dataset.section || '';
  const title = body.dataset.title || '';

  const ADMIN_NAV = [
    ['Dashboard', 'admin-dashboard.html', 'dashboard'], ['Products', 'admin-products.html', 'products'], ['Orders', 'admin-orders.html', 'orders'],
    ['Supply', 'admin-supply-requests.html', 'supply'], ['Customers', 'admin-customers.html', 'customers'], ['Inbox', 'admin-inbox.html', 'inbox'],
    ['Reports', 'admin-reports.html', 'reports'], ['Settings', 'admin-delivery-zones.html', 'settings']
  ];

  const cls = k => (k && k === section ? 'active' : '');
  const links = arr => arr.map(([t, h, k]) => `<a href="${h}" class="${cls(k)}">${t}</a>`).join('');

  if (layout === 'admin') {
    body.classList.add('admin-body');
    const wrap = document.createElement('div');
    wrap.className = 'admin-main';
    wrap.innerHTML = `
      <header class="admin-top">
        <span class="t">${title}</span>
        <div class="u"><a href="admin-orders.html">Orders</a><a href="admin-staff.html">Staff</a><a href="index.html">View store</a><a href="staff-login.html">Sign out</a></div>
      </header>`;
    const main = document.getElementById('main');
    main.classList.add('admin-content');
    main.parentNode.insertBefore(wrap, main);
    wrap.appendChild(main);
    const side = document.createElement('aside');
    side.className = 'admin-side';
    side.innerHTML = `<a href="admin-dashboard.html" class="brand" style="font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:#fff;padding:0 24px 24px;display:block;border-bottom:1px solid rgba(255,255,255,.1)">Catalog Admin</a><nav style="display:flex;flex-direction:column;gap:2px;padding:14px 0">${links(ADMIN_NAV)}</nav>`;
    body.insertBefore(side, wrap);
  }
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  let logs = [];
  let currentFilter = 'All';

  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function fetchLogs() {
    if (!sb) {
      $('rows').innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center">Database client unavailable.</td></tr>';
      return;
    }
    try {
      const { data, error } = await sb.from('activity_log').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      logs = data || [];
      render();
    } catch (err) {
      console.error('Error fetching activity log:', err);
      $('rows').innerHTML = '<tr><td colspan="4" class="text-danger" style="text-align:center">Failed to load activity log from database.</td></tr>';
    }
  }

  function render() {
    const formattedLogs = logs.map(l => ({
      time: l.created_at ? new Date(l.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : (l.time || '—'),
      staff: l.staff || l.staff_name || 'System',
      action: l.action || 'Event',
      item: l.item || l.details || '—'
    }));

    const actions = ['All', ...new Set(formattedLogs.map(l => l.action))];
    
    $('pills').innerHTML = actions.map(act => `
      <button class="pill ${act === currentFilter ? 'active' : ''}" data-f="${esc(act)}">${esc(act)}</button>
    `).join('');

    const filtered = formattedLogs.filter(l => currentFilter === 'All' || l.action === currentFilter);

    $('rows').innerHTML = filtered.map(l => `
      <tr>
        <td>${esc(l.time)}</td>
        <td>${esc(l.staff)}</td>
        <td>${esc(l.action)}</td>
        <td>${esc(l.item)}</td>
      </tr>
    `).join('') || '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">No activity logs recorded yet.</td></tr>';
  }

  $('pills').addEventListener('click', e => {
    const b = e.target.closest('.pill');
    if (b) {
      currentFilter = b.dataset.f;
      render();
    }
  });

  fetchLogs();
});
</script>
</body>
</html>
