<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-md:12px;--r-lg:20px;--r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
h1{font-family:var(--font-display);color:var(--ink-900);line-height:1.2;font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}
.form-msg{font-size:13px;color:var(--danger);min-height:18px}

/* Loading Spinner */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Buttons & Inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.outline{background:transparent;color:var(--forest-700)}
.btn.block{width:100%}

.tabs{display:flex;background:var(--mint-100);padding:5px;border-radius:var(--r-pill);margin-bottom:20px;gap:4px}
.tab{flex:1;white-space:nowrap;background:none;border:0;padding:9px 14px;border-radius:var(--r-pill);font:500 13px var(--font-body);color:var(--ink-700);cursor:pointer;text-align:center}
.tab.active{background:var(--forest-700);color:#fff;font-weight:700}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field input{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none;transition:.2s}
.field input:focus{border-color:var(--forest-700);box-shadow:0 0 0 3px var(--mint-200)}

body.auth{background:var(--forest-900);align-items:center;justify-content:center;padding:16px}
.auth-card{background:#fff;border-radius:var(--r-lg);padding:32px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:18px}
</style>
</head>
<body class="auth" data-layout="auth">
<main class="auth-card" id="main">
  <a href="index.html" class="brand" style="font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink-900)">Business Catalog</a>
  <h1>Welcome back</h1>
  <div class="tabs" style="margin:0"><a class="tab active" href="signin.html">Sign in</a><a class="tab" href="register.html">Create account</a></div>
  
  <form class="stack" id="signinForm" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="id">Email address</label><input id="id" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="form-msg" id="msg" role="alert"></p>
    <button class="btn block" type="submit" id="submitBtn">Sign in</button>
    <a class="btn outline block" href="shop.html">Continue as guest</a>
  </form>
  
  <p class="small muted" style="text-align:center">Staff? <a href="staff-login.html" style="text-decoration:underline">Use the staff portal</a></p>
</main>

<script>
document.getElementById('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const emailInput = document.getElementById('id').value.trim();
  const passwordInput = document.getElementById('pw').value.trim();
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  
  msgEl.textContent = '';

  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  if (!sb) {
    msgEl.textContent = 'Database client is still initializing. Please wait a second.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in...';

  try {
    // 1. Authenticate user session with Supabase
    const { data, error } = await sb.auth.signInWithPassword({
      email: emailInput,
      password: passwordInput,
    });

    if (error) throw error;

    // 2. Fetch role from profiles table (Fixed to match your actual schema)
    const { data: profile } = await sb
      .from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .maybeSingle();

    const role = (profile && profile.role) || 'retail';

    msgEl.style.color = 'var(--success)';
    msgEl.textContent = 'Success! Redirecting...';

    // 3. Smart Redirect: Owner, Admin, or Staff go straight to admin-dashboard.html
    setTimeout(() => {
      if (role === 'owner' || role === 'admin' || role === 'staff') {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'account.html';
      }
    }, 600);

  } catch (err) {
    msgEl.style.color = 'var(--danger)';
    msgEl.textContent = err.message || 'Invalid login credentials.';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
