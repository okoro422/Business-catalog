<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Layout & Elements ---------- */
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn.block{width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:16px}
.split{display:grid;gap:24px;grid-template-columns:1fr}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}.line.total{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px}
.cart-item .ctl{display:flex;align-items:center;gap:12px}
.summary{position:sticky;top:90px}
.link-danger{background:none;border:0;color:var(--danger);font:600 12px var(--font-body);cursor:pointer;text-decoration:underline}
.stepper{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--r-pill);padding:4px;background:#fff}
.stepper button{width:34px;height:34px;border-radius:50%;border:0;background:var(--mint-100);color:var(--forest-700);font-size:18px;cursor:pointer}
.stepper span{min-width:36px;text-align:center;font-weight:700}

@media(min-width:900px){
  .split.sidebar-right{grid-template-columns:1fr 340px;align-items:start}
}
</style>
</head>
<body data-layout="shop" data-section="">
<main class="container" id="main"><div id="cartRoot"></div></main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const root = document.getElementById('cartRoot');

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');

  // Fetch live cart or fallback to empty state
  async function fetchLiveCart() {
    if (!sb) return [];
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return JSON.parse(localStorage.getItem('bc_cart') || '[]');
      
      const { data, error } = await sb.from('cart_items').select('*, products(*)').eq('user_id', user.id);
      if (error) throw error;
      return data || [];
    } catch (err) {
      console.error('Error fetching live cart:', err);
      return [];
    }
  }

  async function render() {
    const items = await fetchLiveCart();

    if (!items.length) {
      root.innerHTML = `
        <div class="empty">
          <i class="fa-solid fa-cart-shopping" style="font-size:42px;color:var(--forest-700)"></i>
          <h2 style="margin:14px 0 6px">Your cart is empty</h2>
          <p style="margin-bottom:20px">Add some products from the shop and they will show up here.</p>
          <a class="btn" href="shop.html">Start shopping</a>
        </div>`;
      return;
    }

    let subtotal = 0;
    const rowsHtml = items.map(item => {
      const p = item.products || {};
      const price = item.price || p.price || 0;
      const total = price * item.qty;
      subtotal += total;

      return `
        <div class="cart-item">
          <div>
            <h3>${p.name || 'Product'}</h3>
            <p class="muted">${item.qty} × ${naira(price)} = <strong>${naira(total)}</strong></p>
          </div>
          <div class="ctl">
            <div class="stepper">
              <button type="button" class="qty-btn" data-id="${item.id}" data-delta="-1" ${item.qty <= 1 ? 'disabled' : ''}>−</button>
              <span>${item.qty}</span>
              <button type="button" class="qty-btn" data-id="${item.id}" data-delta="1">+</button>
            </div>
            <button class="link-danger remove-btn" type="button" data-id="${item.id}">Remove</button>
          </div>
        </div>`;
    }).join('');

    root.innerHTML = `
      <h1 style="margin-bottom:20px">Your cart (${items.length} ${items.length === 1 ? 'item' : 'items'})</h1>
      <div class="split sidebar-right">
        <div class="stack" style="gap:12px">${rowsHtml}</div>
        <div class="card summary stack" style="gap:6px">
          <div class="line"><span>Subtotal</span><strong>${naira(subtotal)}</strong></div>
          <div class="line"><span>Delivery</span><span class="muted">Calculated at checkout</span></div>
          <div class="line total"><span>Total</span><span>${naira(subtotal)}</span></div>
          <p class="small muted">Free delivery in Zone A on orders over ₦50,000.</p>
          <a href="checkout.html" class="btn block" style="margin-top:8px">Proceed to checkout</a>
          <a href="shop.html" class="btn outline block">Continue shopping</a>
        </div>
      </div>`;
  }

  root.addEventListener('click', async e => {
    const rmBtn = e.target.closest('.remove-btn');
    const qtyBtn = e.target.closest('.qty-btn');

    if (rmBtn && sb) {
      const id = rmBtn.dataset.id;
      await sb.from('cart_items').delete().eq('id', id);
      toast('Item removed');
      render();
    }

    if (qtyBtn && sb) {
      const id = qtyBtn.dataset.id;
      const delta = parseInt(qtyBtn.dataset.delta);
      // Logic to update quantity live in database
      toast('Quantity updated');
      render();
    }
  });

  render();
});
</script>
</body>
</html>
