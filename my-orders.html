<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Supabase JS Client Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}h2{font-size:1.35rem}h3{font-size:1.05rem}h4{font-size:1rem}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.text-success{color:var(--success)}.text-warning{color:var(--warning)}.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Shop shell ---------- */
.announcement{background:var(--forest-900);color:#fff;text-align:center;font-size:12px;font-weight:500;padding:8px 16px}
.site-header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-inner{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink-900);white-space:nowrap}
.desktop-nav{display:none;gap:20px;font-weight:500}
.desktop-nav a{padding:4px 0;border-bottom:2px solid transparent}
.desktop-nav a:hover,.desktop-nav a.active{border-color:var(--forest-700);color:var(--ink-900)}
.header-search{display:none;flex:1;position:relative;max-width:420px}
.header-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-500)}
.header-search input{width:100%;height:40px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--cream-100);padding:0 16px 0 38px;font:inherit;outline:none}
.header-search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--forest-700);box-shadow:0 0 0 3px var(--mint-200)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.icon-link{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r-pill);background:none;border:0;cursor:pointer;color:var(--ink-900);font:inherit;font-size:13px}
.icon-link:hover{background:var(--cream-100)}
.icon-link i{font-size:16px}
.icon-link .lbl{display:none}
.badge-dot{background:var(--forest-700);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.mobile-search{display:none;padding:10px 16px;border-top:1px solid var(--border);gap:8px}
.mobile-search.open{display:flex}
.mobile-search input{flex:1;height:40px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--cream-100);padding:0 16px;font:inherit}
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.container.narrow{max-width:900px}.container.xnarrow{max-width:520px}
.site-footer{border-top:1px solid var(--border);padding:24px 20px;text-align:center;font-size:12px;color:var(--ink-500)}
.site-footer a{margin:0 8px;text-decoration:underline}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:var(--tabbar);background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:60}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-500);flex:1;padding:6px 0;background:none;border:0;cursor:pointer}
.tabbar i{font-size:17px}.tabbar .active{color:var(--forest-700);font-weight:700}
body.has-tabbar{padding-bottom:var(--tabbar)}

/* Bottom sheet menu (mobile "Menu" / admin "More") */
.sheet{position:fixed;inset:0;background:rgba(15,42,29,.5);z-index:95;display:none}
.sheet.open{display:block}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.sheet-panel h3{margin-bottom:6px}
.sheet-panel a{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--border);font-weight:500;color:var(--ink-900)}
.sheet-panel a:last-child{border-bottom:0}
.sheet-panel a i{width:20px;text-align:center;color:var(--forest-700)}
.sheet-panel a.active{color:var(--forest-700);font-weight:700}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn.white{background:#fff;color:var(--forest-900);border-color:#fff}
.btn.ghost-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn.block{width:100%}.btn.sm{padding:7px 14px;font-size:13px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.add-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--forest-700);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.add-btn:hover{background:var(--forest-600)}
.link-danger{background:none;border:0;color:var(--danger);font:600 12px var(--font-body);cursor:pointer;text-decoration:underline}

/* ---------- Cards, grids ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
a.card:hover{border-color:var(--sage-300)}
.stack{display:flex;flex-direction:column;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.products{grid-template-columns:repeat(2,1fr)}
.grid.metrics{grid-template-columns:repeat(2,1fr)}
.split{display:grid;gap:24px;grid-template-columns:1fr}
.page-head{margin-bottom:20px}.page-head p{color:var(--ink-500);margin-top:4px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}
.product-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1);transition:.2s}
.product-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.product-img{background:var(--mint-50);border:1px solid var(--mint-100);border-radius:var(--r-md);height:150px;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--forest-700);overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.price{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.hero{background:var(--forest-900);color:#fff;border-radius:var(--r-lg);padding:32px 24px;display:grid;gap:24px;overflow:hidden}
.hero h1{color:#fff;font-size:clamp(1.7rem,4vw,2.6rem);margin:12px 0}
.hero p{color:var(--sage-300);max-width:520px}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap}
.hero-tags span{border:1px solid rgba(255,255,255,.3);border-radius:var(--r-pill);padding:3px 10px;font-size:11px;letter-spacing:.5px}
.hero-visual{display:none;align-items:center;justify-content:center;gap:12px;color:var(--mint-200)}
.hero-visual img{width:100px;height:140px;object-fit:cover;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.promo{border-radius:var(--r-lg);padding:24px;display:block}
.promo.light{background:var(--mint-100)}.promo.dark{background:var(--forest-700);color:#fff}.promo.dark h3{color:#fff}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}

/* ---------- Pills, tabs, badges ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.pill{background:var(--cream-100);border:1px solid var(--border);color:var(--ink-500);padding:8px 16px;border-radius:var(--r-pill);font:600 12px var(--font-body);white-space:nowrap;cursor:pointer;transition:.2s;display:inline-block}
.pill.active{background:var(--forest-700);border-color:var(--forest-700);color:#fff}
.tabs{display:flex;background:var(--mint-100);padding:5px;border-radius:var(--r-pill);margin-bottom:20px;overflow-x:auto;gap:4px}
.tab{flex:1;white-space:nowrap;background:none;border:0;padding:9px 14px;border-radius:var(--r-pill);font:500 13px var(--font-body);color:var(--ink-700);cursor:pointer;text-align:center}
.tab.active{background:var(--forest-700);color:#fff;font-weight:700}
.badge{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--mint-100);color:var(--forest-700);border:1px solid var(--sage-300)}
.badge.warn{background:#FEF3C7;color:#92400E;border-color:#F5DFA0}
.badge.gray{background:var(--cream-100);color:var(--ink-500);border-color:var(--border)}
.badge.danger{background:#FBE7E3;color:var(--danger);border-color:#F0C4BC}

/* ---------- Forms ---------- */
.form-grid{display:grid;gap:14px;grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none;transition:.2s}
.field input.err,.field select.err{border-color:var(--danger)}
.field.full{grid-column:1/-1}.full{grid-column:1/-1}
.form-msg{font-size:13px;color:var(--danger);min-height:18px}
.sel{padding:8px 14px;border:1px solid var(--border);border-radius:var(--r-pill);background:#fff;font:inherit;color:var(--ink-900);cursor:pointer}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}

/* ---------- Tables ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tr.clickable,.row-click{cursor:pointer}tr.clickable:hover{background:var(--mint-50)}
.tier-table td:first-child{font-weight:600}

/* ---------- Lists / receipt / steps ---------- */
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}.line.total{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.line.save{color:var(--success)}
.steps{display:flex;gap:10px;overflow-x:auto}
.step{white-space:nowrap;font-size:12px;color:var(--ink-500)}.step.active{color:var(--ink-900);font-weight:700}
.kanban{display:grid;gap:14px;grid-template-columns:1fr}
.kcol{background:var(--mint-50);border:1px solid var(--mint-200);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.kcol h4{font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--mint-200)}
.kcard{display:block;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow-1)}
.track{display:flex;flex-direction:column;gap:14px}
.track div{display:flex;gap:10px;align-items:center;color:var(--ink-500);font-weight:600}
.track div.on{color:var(--forest-700)}
.notice{background:var(--mint-100);border:1px solid var(--mint-200);border-radius:var(--r-md);padding:12px 16px;font-size:13px}
.ok-box{background:var(--mint-100);border:1px solid var(--mint-200);border-radius:var(--r-md);padding:20px;text-align:center}

/* ---------- Chat ---------- */
.chat-card{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:440px;padding:0;overflow:hidden}
.chat-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);font-weight:700;color:var(--ink-900)}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.chat-input{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border);background:#fff;align-items:center}
.chat-input input[type=text]{flex:1;height:44px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--cream-100);padding:0 16px;font:inherit;outline:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--forest-700);color:#fff;cursor:pointer;flex-shrink:0}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px}
.bubble.in{background:var(--cream-100);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:var(--forest-700);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bubble.internal{background:#FFF7DB;border:1px dashed #E5C96B;color:var(--ink-900);align-self:flex-end}
.note{align-self:center;font-size:12px;color:var(--ink-500)}

/* ---------- Auth ---------- */
body.auth{background:var(--forest-900);align-items:center;justify-content:center;padding:16px}
.auth-card{background:#fff;border-radius:var(--r-lg);padding:32px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:18px}
.auth-card.wide{max-width:720px}

/* ---------- Shop page ---------- */
.shop-layout{display:grid;gap:24px;grid-template-columns:1fr}
.shop-sidebar{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:#fff;z-index:80;padding:20px;overflow-y:auto;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-2)}
.shop-sidebar.open{transform:none}
.backdrop{position:fixed;inset:0;background:rgba(15,42,29,.45);z-index:70;display:none}
.backdrop.open{display:block}
.sidebar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.filter-group{border-bottom:1px solid var(--border);padding:14px 0}
.filter-title{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0;font:700 14px var(--font-body);color:var(--ink-900);cursor:pointer}
.filter-body{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.filter-group.collapsed .filter-body{display:none}
.filter-group.collapsed .filter-title i{transform:rotate(-90deg)}
.filter-list{list-style:none}
.filter-list a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:var(--r-sm)}
.filter-list a:hover,.filter-list a.active{background:var(--mint-100);color:var(--forest-700);font-weight:600}
.price-inputs{display:flex;gap:8px;align-items:center}
.price-inputs input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--cream-100);font:inherit;outline:none}
.shop-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.controls{display:flex;gap:8px;position:relative}
.control-btn{display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border:1px solid var(--border);background:#fff;border-radius:var(--r-pill);font:600 13px var(--font-body);cursor:pointer;color:var(--ink-900)}
.sort-menu,.dropdown-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);min-width:200px;display:none;z-index:30;overflow:hidden}
.sort-menu.open,.dropdown-menu.open{display:block}
.sort-menu button{display:block;width:100%;text-align:left;padding:10px 16px;background:none;border:0;font:inherit;cursor:pointer}
.sort-menu button:hover,.sort-menu button.active,.dropdown-menu a:hover{background:var(--mint-100)}
.dropdown{position:relative}
.dropdown-menu a{display:block;padding:10px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--forest-700);color:#fff;border:0;padding:6px 14px;border-radius:var(--r-pill);font:600 12px var(--font-body);cursor:pointer}
.cart-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + 10px);background:var(--forest-900);color:#fff;border-radius:var(--r-pill);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:55;box-shadow:var(--shadow-2);font-weight:600}

/* ---------- Admin shell ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-top .t{font-weight:700;color:var(--ink-900)}
.admin-top .u{display:flex;gap:14px;font-size:12px;color:var(--ink-500);flex-wrap:wrap;justify-content:flex-end}
.admin-top .u a:hover{color:var(--forest-700)}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}
</style>
</head>
<body data-layout="shop" data-section="orders">
<main class="container narrow" id="main">
  <div class="row-between page-head"><h1>My Orders</h1><div class="field" style="min-width:200px"><input id="q" type="search" placeholder="Search order number"></div></div>
  <div class="pills" id="pills">
    <button type="button" class="pill active" data-f="all">All</button><button type="button" class="pill" data-f="active">Active</button>
    <button type="button" class="pill" data-f="Delivered">Delivered</button><button type="button" class="pill" data-f="Cancelled">Cancelled</button>
  </div>
  <div class="stack" id="list"></div>
</main>

<script>
/* Shared Layout Script */
(function () {
  const body = document.body;
  const layout = body.dataset.layout || 'shop';      
  const section = body.dataset.section || '';        
  const title = body.dataset.title || '';            

  const SHOP_NAV = [['Shop', 'shop.html', 'shop'], ['Wholesale', 'wholesale.html', 'wholesale'], ['Supply request', 'supply-request.html', 'supply']];
  const SHOP_TABS = [
    ['Home', 'index.html', 'home', 'fa-solid fa-house'], ['Shop', 'shop.html', 'shop', 'fa-solid fa-store'],
    ['Orders', 'my-orders.html', 'orders', 'fa-solid fa-box-archive'], ['Messages', 'chat.html', 'messages', 'fa-regular fa-comment-dots'],
    ['Account', 'account.html', 'account', 'fa-regular fa-user']
  ];
  const SHOP_MENU = [
    ['Home', 'index.html', 'fa-solid fa-house', 'home'], ['Shop', 'shop.html', 'fa-solid fa-store', 'shop'],
    ['Wholesale', 'wholesale.html', 'fa-solid fa-boxes-stacked', 'wholesale'], ['Request a wholesale quote', 'supply-request.html', 'fa-solid fa-file-invoice', 'supply'],
    ['My orders', 'my-orders.html', 'fa-solid fa-box-archive', 'orders'], ['My quotes', 'my-quotes.html', 'fa-solid fa-receipt', 'quotes'],
    ['Saved items', 'wishlist.html', 'fa-regular fa-heart', 'saved'], ['Notifications', 'notifications.html', 'fa-regular fa-bell', 'notifications'],
    ['Help & support', 'support.html', 'fa-regular fa-circle-question', 'support'], ['My account', 'account.html', 'fa-regular fa-user', 'account'],
    ['Sign in', 'signin.html', 'fa-solid fa-right-to-bracket', ''], ['Staff portal', 'staff-login.html', 'fa-solid fa-lock', '']
  ];

  const cls = k => (k && k === section ? 'active' : '');
  const links = arr => arr.map(([t, h, k]) => `<a href="${h}" class="${cls(k)}">${t}</a>`).join('');
  const tabs = arr => arr.map(([t, h, k, i]) => `<a href="${h}" class="${cls(k)}"><i class="${i}"></i><span>${t}</span></a>`).join('');
  const sheet = (id, heading, rows) => `<div class="sheet" id="sheet-${id}"><div class="sheet-panel"><h3>${heading}</h3>${rows.map(([t, h, i, k]) => `<a href="${h}" class="${cls(k)}"><i class="${i}"></i>${t}</a>`).join('')}</div></div>`;

  function shopHeader() {
    return `
    <div class="announcement">Free delivery in Abuja over ₦50,000</div>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="brand">Business Catalog</a>
        <nav class="desktop-nav">${links(SHOP_NAV)}</nav>
        <form class="header-search" action="shop.html" method="get">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" name="q" placeholder="Search products, brands &amp; supplies...">
        </form>
        <div class="header-actions">
          <button class="icon-link mobile-only" id="searchToggle" aria-label="Search" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
          <a class="icon-link" href="notifications.html" aria-label="Notifications"><i class="fa-regular fa-bell"></i></a>
          <a class="icon-link" href="chat.html"><i class="fa-regular fa-comment-dots"></i><span class="lbl">Messages</span><span class="badge-dot">2</span></a>
          <a class="icon-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="lbl">Cart</span><span class="badge-dot" data-count="cart" style="display:none">0</span></a>
          <a class="icon-link desktop-only" href="account.html"><i class="fa-regular fa-user"></i><span class="lbl">Account</span></a>
          <button class="icon-link mobile-only" data-sheet="menu" aria-label="Menu" type="button"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
      <form class="mobile-search" id="mobileSearch" action="shop.html" method="get">
        <input type="search" name="q" placeholder="Search products &amp; supplies...">
        <button class="icon-link" type="button" id="searchClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </form>
    </header>`;
  }

  function shopFooter() {
    return `
    <footer class="site-footer desktop-only">
      <a href="support.html">Help &amp; support</a><a href="my-quotes.html">My quotes</a><a href="wishlist.html">Saved items</a><a href="notifications.html">Notifications</a><a href="staff-login.html">Staff portal</a>
      <p style="margin-top:8px">© Business Catalog · Abuja, Nigeria</p>
    </footer>
    <nav class="tabbar mobile-only">${tabs(SHOP_TABS)}</nav>
    ${sheet('menu', 'Menu', SHOP_MENU)}`;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const main = document.getElementById('main');
    if (layout === 'shop' && main) {
      body.classList.add('has-tabbar');
      body.insertAdjacentHTML('afterbegin', shopHeader());
      main.insertAdjacentHTML('afterend', shopFooter());
    }
  });

  document.addEventListener('click', e => {
    const opener = e.target.closest('[data-sheet]');
    if (opener) { const s = document.getElementById('sheet-' + opener.dataset.sheet); if (s) s.classList.add('open'); return; }
    if (e.target.classList && e.target.classList.contains('sheet')) { e.target.classList.remove('open'); return; }
    if (e.target.closest('#searchToggle')) { const b = document.getElementById('mobileSearch'); b.classList.add('open'); b.querySelector('input').focus(); return; }
    if (e.target.closest('#searchClose')) { document.getElementById('mobileSearch').classList.remove('open'); return; }
  });
})();
</script>

<script>
/* Supabase Integration for My Orders Page */
(function () {
  // TODO: Replace with your actual Supabase URL and Anon Key
  const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const supabaseClient = window.supabase && SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL' 
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
    : null;

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const STEPS = ['Placed', 'Confirmed', 'Packed', 'Out for delivery', 'Delivered'];
  let f = 'all', q = '', open = null, ordersList = [];

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const badge = s => `<span class="badge ${s === 'Delivered' ? '' : s === 'Cancelled' ? 'danger' : 'warn'}">${s}</span>`;

  function detail(o) {
    const at = STEPS.indexOf(o.status);
    const items = o.items || [];
    return `<div class="stack" style="gap:10px;border-top:1px solid var(--border);padding-top:12px">
      <div class="steps">${STEPS.map((s, i) => `<span class="step ${i <= at ? 'active' : ''}">${i + 1}${s}</span>`).join('')}</div>
      ${items.map(i => `<div class="line"><span>${i.qty} × ${esc(i.name)}</span><strong>${naira(i.total || i.price * i.qty)}</strong></div>`).join('')}
      <div class="line"><span>Delivery</span><strong>${o.fee ? naira(o.fee) : 'Free'}</strong></div>
      <div class="btn-row" style="margin:0"><a class="btn sm outline" href="chat.html">Message us</a>
        ${['Placed', 'Confirmed'].includes(o.status) ? `<a class="btn sm outline" href="cancel-return.html?id=${o.id}&type=cancel">Cancel order</a>` : ''}
        ${o.status === 'Delivered' ? `<a class="btn sm outline" href="cancel-return.html?id=${o.id}&type=return">Return items</a>` : ''}</div></div>`;
  }

  function render() {
    const filtered = ordersList.filter(o => 
      (f === 'all' || (f === 'active' ? !['Delivered', 'Cancelled'].includes(o.status) : o.status === f)) && 
      (!q || o.id.toLowerCase().includes(q))
    );

    document.getElementById('list').innerHTML = filtered.length ? filtered.map(o => `<div class="card stack" style="gap:12px">
      <div class="row-between"><div><div class="price">#${esc(o.id)}</div><div class="small muted">${date(o.date)} · ${esc(o.area || '')}</div></div>${badge(o.status)}</div>
      <div class="row-between"><span class="price">${naira(o.total)}</span>
        <span style="display:flex;gap:8px">${o.status === 'Delivered' ? `<button class="btn sm outline" type="button" data-reorder="${esc(o.id)}">Reorder</button>` : ''}<button class="btn sm" type="button" data-track="${esc(o.id)}">${open === o.id ? 'Hide' : 'Track'}</button></span></div>
      ${open === o.id ? detail(o) : ''}</div>`).join('')
      : '<div class="empty"><h3>No orders here</h3><p style="margin:8px 0 18px">Orders you place will show up in this list.</p><a class="btn" href="shop.html">Start shopping</a></div>';
  }

  async function fetchOrders() {
    if (supabaseClient) {
      const { data, error } = await supabaseClient.from('orders').select('*, items:order_items(*)').order('date', { ascending: false });
      if (!error && data) {
        ordersList = data;
      }
    }
    // Fallback/Demo check if table is empty or offline
    if (!ordersList.length) {
      ordersList = [
        { id: 'BC-10482', date: '2026-10-17T10:00:00', status: 'Out for delivery', area: 'Wuse 2', subtotal: 52200, fee: 1500, total: 53700, items: [{ name: 'Shea Butter Soap 150g · wholesale', qty: 48, price: 900, total: 43200 }] }
      ];
    }
    render();
  }

  document.addEventListener('DOMContentLoaded', () => {
    fetchOrders();

    document.getElementById('pills').addEventListener('click', e => { 
      const b = e.target.closest('.pill'); 
      if (b) { f = b.dataset.f; render(); } 
    });

    document.getElementById('q').addEventListener('input', e => { 
      q = e.target.value.trim().toLowerCase(); 
      render(); 
    });

    document.getElementById('list').addEventListener('click', e => {
      const t = e.target.closest('[data-track]'); 
      if (t) { open = open === t.dataset.track ? null : t.dataset.track; render(); return; }
    });
  });
})();
</script>
</body>
</html>
