<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order receipt — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Layout & Elements ---------- */
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:16px}
.split{display:grid;gap:24px;grid-template-columns:1fr}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}.line.total{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.track{display:flex;flex-direction:column;gap:14px}
.track div{display:flex;gap:10px;align-items:center;color:var(--ink-500);font-weight:600}
.track div.on{color:var(--forest-700)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}

@media(min-width:900px){
  .split.sidebar-right{grid-template-columns:1fr 340px;align-items:start}
}
@media print{
  .btn-row,.site-header,.site-footer,.tabbar{display:none!important}
}
</style>
</head>
<body data-layout="shop" data-section="orders">
<main class="container" id="main"><div id="receipt"><div class="empty">Loading receipt...</div></div></main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const root = document.getElementById('receipt');

  const naira = n => '₦' + Math.round(n || 0).toLocaleString('en-NG');

  if (!sb) {
    root.innerHTML = '<div class="empty"><h2>Authentication error</h2><p style="margin:8px 0 20px">Could not connect to database.</p><a class="btn" href="signin.html">Sign in</a></div>';
    return;
  }

  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    location.href = 'signin.html';
    return;
  }

  const orderId = sessionStorage.getItem('bc_last_order_id');
  if (!orderId) {
    root.innerHTML = '<div class="empty"><h2>No recent order found</h2><p style="margin:8px 0 20px">Place an order and your receipt will appear here.</p><a class="btn" href="shop.html">Go to shop</a></div>';
    return;
  }

  let order = null;
  let items = [];

  try {
    // 1. Fetch order header details
    const { data: orderData, error: orderErr } = await sb.from('orders').select('*').eq('id', orderId).eq('user_id', user.id).single();
    if (orderErr || !orderData) throw orderErr;
    order = orderData;

    // 2. Fetch order line items
    const { data: itemsData, error: itemsErr } = await sb.from('order_items').select('*').eq('order_id', orderId);
    if (itemsErr) throw itemsErr;
    items = itemsData || [];
  } catch (err) {
    console.error('Error fetching receipt data:', err);
    root.innerHTML = '<div class="empty"><h2>Could not load receipt</h2><p style="margin:8px 0 20px">Please check your order history.</p><a class="btn" href="my-orders.html">My orders</a></div>';
    return;
  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const PAY = { online: 'Online payment (pending)', cash: 'Cash on delivery (pending)', transfer: 'Transfer on delivery (pending)' };
  
  const orderDate = new Date(order.created_at || order.date || Date.now()).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const steps = ['Placed', 'Confirmed', 'Packed', 'Out for delivery', 'Delivered'];
  
  document.title = 'Receipt #' + String(order.id).slice(0, 8) + ' — Business Catalog';

  const itemsHtml = items.map(i => `<div class="line"><span>${i.qty} × ${esc(i.name)}</span><strong>${naira(i.total)}</strong></div>`).join('');

  root.innerHTML = `
    <h1>Thank you, ${esc((order.customer_name || 'there').split(' ')[0])}! Order placed successfully</h1>
    <p class="muted" style="margin:4px 0 24px">We will update you here as your order progresses.</p>
    <div class="split sidebar-right">
      <div>
        <div class="card stack" style="gap:2px">
          <div class="line"><span>Order #${String(order.id).slice(0, 8)} · ${orderDate}</span></div>
          <div class="line"><span>Payment</span><strong>${PAY[order.payment_method] || esc(order.payment_method)}</strong></div>
          <div class="line"><span>Delivery</span><strong>${esc(order.zone)} · ${esc(order.area)}</strong></div>
          ${itemsHtml}
          <div class="line"><span>Delivery fee</span><strong>${order.delivery_fee ? naira(order.delivery_fee) : 'Free'}</strong></div>
          <div class="line total"><span>TOTAL</span><strong>${naira(order.total)}</strong></div>
        </div>
        <div class="btn-row">
          <a href="my-orders.html" class="btn">Track order</a>
          <button class="btn outline" type="button" onclick="window.print()">Download receipt</button>
          <a href="chat.html" class="btn outline">Message us</a>
          <a href="shop.html" class="btn outline">Keep shopping</a>
        </div>
      </div>
      <aside class="card track">${steps.map((s, i) => `<div class="${i === 0 ? 'on' : ''}"><i class="fa-${i === 0 ? 'solid fa-circle-check' : 'regular fa-circle'}"></i> ${i + 1} ${s}</div>`).join('')}</aside>
    </div>`;
});
</script>
</body>
</html>
