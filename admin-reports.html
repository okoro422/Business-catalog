<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Buttons & Cards ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.grid{display:grid;gap:16px}
.grid.metrics{grid-template-columns:repeat(2,1fr)}
.metric{display:block;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:18px}
.metric .l{font-size:12px;color:var(--ink-500);margin-bottom:6px}.metric .v{font:700 1.5rem var(--font-display);color:var(--ink-900)}
.tabs{display:flex;background:var(--mint-100);padding:5px;border-radius:var(--r-pill);margin-bottom:20px;overflow-x:auto;gap:4px}
.tab{flex:1;white-space:nowrap;background:none;border:0;padding:9px 14px;border-radius:var(--r-pill);font:500 13px var(--font-body);color:var(--ink-700);cursor:pointer;text-align:center}
.tab.active{background:var(--forest-700);color:#fff;font-weight:700}
.bars{height:170px;display:flex;align-items:flex-end;gap:10px}
.bars div{flex:1;background:var(--forest-700);border-radius:6px 6px 0 0;min-height:8px}

/* ---------- Tables ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}

/* ---------- Admin Shell Layout ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

@media(min-width:640px){.grid.metrics{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}.admin-content{padding:28px 32px}
}
@media print{.admin-side,.admin-top,.btn-row{display:none!important}}
</style>
</head>
<body data-layout="admin" data-section="reports" data-title="Reports" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html" class="active">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Business Reports</strong>
      <a href="admin-dashboard.html" class="small muted">← Dashboard</a>
    </header>

    <main class="admin-content" id="main">
      <h1>Reports</h1>
      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-t="Sales">Sales</button>
        <button type="button" class="tab" data-t="Products">Products</button>
        <button type="button" class="tab" data-t="Customers">Customers</button>
        <button type="button" class="tab" data-t="Stock">Stock</button>
      </div>

      <div class="grid metrics" id="metrics">
        <div class="metric"><div class="l">Total Revenue</div><div class="v" id="mRev">₦0</div></div>
        <div class="metric"><div class="l">Total Orders</div><div class="v" id="mOrders">0</div></div>
        <div class="metric"><div class="l">Average Order</div><div class="v" id="mAvg">₦0</div></div>
        <div class="metric"><div class="l">Active Products</div><div class="v" id="mProd">0</div></div>
      </div>

      <div class="card hidden" id="chartCard">
        <h3 style="margin-bottom:14px">Recent order volume</h3>
        <div class="bars" id="bars"></div>
        <div style="display:flex;gap:10px;margin-top:6px" class="small muted" id="labels"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="thead"><tr><th>Details</th></tr></thead>
          <tbody id="tbody"><tr><td class="muted" style="text-align:center;padding:20px">Loading report data from database...</td></tr></tbody>
        </table>
      </div>

      <div class="btn-row" style="margin:0">
        <button class="btn" id="csvBtn" type="button">Export CSV</button>
        <button class="btn outline" type="button" onclick="window.print()">Export PDF</button>
      </div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  let currentTab = 'Sales';
  let orders = [];
  let products = [];
  let customers = [];

  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const naira = n => '₦' + Math.round(n || 0).toLocaleString('en-NG');

  async function loadData() {
    if (!sb) {
      $('tbody').innerHTML = '<tr><td class="text-danger" style="text-align:center">Database connection unavailable.</td></tr>';
      return;
    }
    try {
      const [ordRes, prodRes, custRes] = await Promise.all([
        sb.from('orders').select('*').order('created_at', { ascending: false }),
        sb.from('products').select('*'),
        sb.from('profiles').select('*')
      ]);

      orders = ordRes.data || [];
      products = prodRes.data || [];
      customers = custRes.data || [];
      render();
    } catch (err) {
      console.error('Error loading report analytics:', err);
      $('tbody').innerHTML = '<tr><td class="text-danger" style="text-align:center">Failed to load reports from database.</td></tr>';
    }
  }

  function render() {
    // Top Metrics Calculation
    const totalRev = orders.reduce((acc, o) => acc + Number(o.total || 0), 0);
    const totalOrd = orders.length;
    const avgOrd = totalOrd ? totalRev / totalOrd : 0;
    const activeProd = products.filter(p => (p.stock || 0) > 0).length;

    $('mRev').textContent = naira(totalRev);
    $('mOrders').textContent = totalOrd;
    $('mAvg').textContent = naira(avgOrd);
    $('mProd').textContent = activeProd;

    if (currentTab === 'Sales') {
      $('chartCard').classList.remove('hidden');
      const recent = orders.slice(0, 7).reverse();
      const maxTotal = Math.max(...recent.map(o => Number(o.total || 0)), 1);

      $('bars').innerHTML = recent.map(o => `<div title="Order #${o.id.substring(0,6)}: ${naira(o.total)}" style="height:${Math.max((Number(o.total || 0) / maxTotal) * 100, 10)}%"></div>`).join('') || '<div class="muted">No sales data</div>';
      $('labels').innerHTML = recent.map(o => `<span style="flex:1;text-align:center">${new Date(o.created_at).toLocaleDateString([], {month:'short', day:'numeric'})}</span>`).join('');

      $('thead').innerHTML = '<tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr>';
      $('tbody').innerHTML = orders.map(o => `
        <tr>
          <td><strong>#${o.id.substring(0, 8)}</strong></td>
          <td>${o.customer_name || 'Customer'}</td>
          <td>${o.created_at ? new Date(o.created_at).toLocaleDateString() : '—'}</td>
          <td>${naira(o.total)}</td>
          <td><span class="badge">${o.status || 'New'}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="muted" style="text-align:center;padding:20px">No sales recorded yet.</td></tr>';

    } else if (currentTab === 'Products') {
      $('chartCard').classList.add('hidden');
      $('thead').innerHTML = '<tr><th>Product Name</th><th>SKU</th><th>Price</th><th>Stock</th></tr>';
      $('tbody').innerHTML = products.map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td>${p.sku || 'N/A'}</td>
          <td>${naira(p.price)}</td>
          <td class="${p.stock <= 5 ? 'text-warning' : ''}">${p.stock || 0}</td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">No products found.</td></tr>';

    } else if (currentTab === 'Customers') {
      $('chartCard').classList.add('hidden');
      $('thead').innerHTML = '<tr><th>Name</th><th>Email / ID</th><th>Account Type</th></tr>';
      $('tbody').innerHTML = customers.map(c => `
        <tr>
          <td><strong>${c.full_name || 'Customer'}</strong></td>
          <td>${c.id.substring(0, 8)}...</td>
          <td>${c.account_type || 'retail'}</td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="muted" style="text-align:center;padding:20px">No customers registered yet.</td></tr>';

    } else if (currentTab === 'Stock') {
      $('chartCard').classList.add('hidden');
      $('thead').innerHTML = '<tr><th>Product</th><th>Stock Level</th><th>Status</th></tr>';
      $('tbody').innerHTML = products.map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td>${p.stock || 0} units</td>
          <td><span class="badge ${p.stock <= 5 ? 'warn' : ''}">${p.stock <= 5 ? 'Low Stock' : 'In Stock'}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="muted" style="text-align:center;padding:20px">Inventory is empty.</td></tr>';
    }
  }

  $('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.t;
      render();
    }
  });

  $('csvBtn').addEventListener('click', () => {
    let csvContent = "data:text/csv;charset=utf-8,";
    if (currentTab === 'Sales') {
      csvContent += "OrderID,Customer,Date,Total,Status\n" + orders.map(o => `"${o.id}","${o.customer_name || ''}","${o.created_at || ''}",${o.total || 0},"${o.status || ''}"`).join("\n");
    } else {
      csvContent += "Name,Stock,Price\n" + products.map(p => `"${p.name}",${p.stock || 0},${p.price || 0}`).join("\n");
    }
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `report-${currentTab.toLowerCase()}.csv`);
    document.body.appendChild(link);
    link.click();
    link.remove();
  });

  loadData();
});
</script>
</body>
</html>
