<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Details — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
h1{font-family:var(--font-display);color:var(--ink-900);font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2)}

/* Admin Shell Layout */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

/* Elements */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.grid.metrics{grid-template-columns:repeat(2,1fr);display:grid;gap:16px}
.metric{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:18px}
.metric .l{font-size:12px;color:var(--ink-500);margin-bottom:6px}
.metric .v{font:700 1.5rem var(--font-display);color:var(--ink-900)}
.tabs{display:flex;background:var(--mint-100);padding:5px;border-radius:var(--r-pill);margin-bottom:20px;gap:4px;overflow-x:auto}
.tab{flex:1;white-space:nowrap;background:none;border:0;padding:9px 14px;border-radius:var(--r-pill);font:500 13px var(--font-body);color:var(--ink-700);cursor:pointer;text-align:center}
.tab.active{background:var(--forest-700);color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}
.btn.outline:hover{background:var(--mint-100)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}
.field{display:flex;flex-direction:column;gap:6px}
.field textarea{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}

@media(min-width:640px){.grid.metrics{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.admin-side{display:block}.admin-top{padding:16px 32px}.admin-content{padding:28px 32px}}
</style>
</head>
<body data-layout="admin" data-section="customers" data-title="Customers" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html" class="active">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Customer Profile</strong>
      <a href="admin-customers.html" class="small muted">← All Customers</a>
    </header>

    <main class="admin-content" id="main">
      <div id="c"><div class="muted" style="text-align:center;padding:40px">Loading customer profile...</div></div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const root = document.getElementById('c');
  const customerId = new URLSearchParams(location.search).get('id');

  // Initialize Supabase client
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  const naira = n => '₦' + Math.round(n || 0).toLocaleString('en-NG');
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  if (!sb || !customerId) {
    root.innerHTML = '<div class="empty"><h2>Customer not found</h2><a class="btn" href="admin-customers.html">Back to customers</a></div>';
    return;
  }

  try {
    // Fetch customer data from Supabase 'customers' table
    const { data: customer, error } = await sb.from('customers').select('*').eq('id', customerId).single();
    if (error || !customer) throw (error || new Error('Not found'));

    let tab = 'Overview';

    function draw() {
      const customerName = customer.name || customer.full_name || 'Customer';
      const customerTier = customer.tier || 'Retail';
      const customerZone = customer.zone || 'A';
      const lifetimeSpent = customer.lifetime_spent || customer.spent || 0;
      const outstandingVal = customer.outstanding || 0;
      const customerPhone = customer.phone || '—';
      const customerNotes = customer.notes || '';

      const panel = { 
        Overview: `<p style="font-weight:700;margin-bottom:10px">Customer Overview</p><div class="line"><span>Email</span><span>${esc(customer.email || '—')}</span></div><div class="line"><span>Phone</span><span>${esc(customerPhone)}</span></div>`, 
        Orders: `<p class="muted">No orders linked yet.</p>`,
        Quotes: `<p class="muted">No quotes recorded.</p>`,
        Addresses: `<div class="line"><span>Zone</span><span>${esc(customerZone)}</span></div><div class="line"><span>Phone</span><span>${esc(customerPhone)}</span></div>`,
        Notes: `<div class="field"><textarea id="cn" rows="4" placeholder="Add an internal note...">${esc(customerNotes)}</textarea></div><button class="btn sm outline" id="sn" type="button" style="margin-top:10px">Save note</button>` 
      }[tab];

      root.innerHTML = `
        <div class="row-between">
          <div>
            <h1>${esc(customerName)}</h1>
            <p class="muted">${esc(customerTier)} · Zone ${esc(customerZone)}</p>
          </div>
          <a class="muted" href="admin-customers.html">← All customers</a>
        </div>
        <div class="grid metrics" style="margin:20px 0">
          <div class="metric"><div class="l">Lifetime Spent</div><div class="v">${naira(lifetimeSpent)}</div></div>
          <div class="metric"><div class="l">Total Orders</div><div class="v">0</div></div>
          <div class="metric"><div class="l">Average Order</div><div class="v">${naira(0)}</div></div>
          <div class="metric"><div class="l">Outstanding</div><div class="v">${naira(outstandingVal)}</div></div>
        </div>
        <div class="tabs">
          ${['Overview', 'Orders', 'Quotes', 'Addresses', 'Notes'].map(t => `<button type="button" class="tab ${t === tab ? 'active' : ''}" data-t="${t}">${t}</button>`).join('')}
        </div>
        <div class="card">${panel}</div>
        <div class="btn-row">
          <button class="btn" id="ap" type="button" ${customerTier === 'Pending' ? '' : 'disabled'}>${customerTier === 'Pending' ? 'Approve Tier' : 'Approved ✓'}</button>
          <a class="btn outline" href="admin-inbox.html?customer=${customer.id}">Message Customer</a>
        </div>
      `;

      root.querySelector('.tabs').onclick = e => { 
        const b = e.target.closest('.tab'); 
        if (b) { tab = b.dataset.t; draw(); } 
      };

      const approveBtn = document.getElementById('ap');
      if (approveBtn && customerTier === 'Pending') {
        approveBtn.onclick = async () => {
          try {
            const { error } = await sb.from('customers').update({ tier: 'Wholesale T1' }).eq('id', customerId);
            if (error) throw error;
            customer.tier = 'Wholesale T1';
            toast('Customer tier approved');
            draw();
          } catch (err) {
            console.error('Error approving customer:', err);
            toast('Failed to update status');
          }
        };
      }

      const saveNoteBtn = document.getElementById('sn'); 
      if (saveNoteBtn) {
        saveNoteBtn.onclick = async () => {
          const noteText = document.getElementById('cn').value;
          try {
            const { error } = await sb.from('customers').update({ notes: noteText }).eq('id', customerId);
            if (error) throw error;
            customer.notes = noteText;
            toast('Note saved successfully');
          } catch (err) {
            console.error('Error saving note:', err);
            toast('Failed to save note');
          }
        };
      }
    }

    draw();
  } catch (err) {
    console.error('Error loading customer:', err);
    root.innerHTML = '<div class="empty"><h2>Customer record not found in database</h2><a class="btn" href="admin-customers.html">Back to customers</a></div>';
  }
});
</script>
</body>
</html>
