<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff and Roles — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Buttons & Cards ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.badge{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--mint-100);color:var(--forest-700);border:1px solid var(--sage-300)}
.badge.gray{background:var(--cream-100);color:var(--ink-500);border-color:var(--border)}
.link-danger{background:none;border:0;color:var(--danger);font:600 12px var(--font-body);cursor:pointer;text-decoration:underline}

/* ---------- Forms & Modals ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field input,.field select{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none}
.modal-bg{position:fixed;inset:0;background:rgba(15,42,29,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:90}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);padding:24px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}

/* ---------- Tables ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
.sub-section-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:var(--cream-100);border:1px solid var(--border);color:var(--ink-500);padding:8px 16px;border-radius:var(--r-pill);font:600 12px var(--font-body);white-space:nowrap;cursor:pointer;transition:.2s;display:inline-block}
.pill.active{background:var(--forest-700);border-color:var(--forest-700);color:#fff}

/* ---------- Admin Shell Layout ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}.admin-content{padding:28px 32px}
}
@media print{.admin-side,.admin-top,.btn-row{display:none!important}}
</style>
</head>
<body data-layout="admin" data-section="settings" data-title="Settings" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html" class="active">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Staff Management</strong>
      <a href="admin-delivery-zones.html" class="small muted">← Settings</a>
    </header>

    <main class="admin-content" id="main">
      <h1>Staff and roles</h1>
      <div class="sub-section-links">
        <a class="pill" href="admin-delivery-zones.html">Delivery zones</a>
        <a class="pill" href="admin-categories.html">Categories</a>
        <a class="pill active" href="admin-staff.html">Staff</a>
        <a class="pill" href="admin-activity-log.html">Activity log</a>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Role</th><th>Email</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="muted" style="text-align:center;padding:20px">Loading staff from database...</td></tr>
          </tbody>
        </table>
      </div>

      <div><button class="btn" id="invite" type="button">Invite staff</button></div>

      <div class="modal-bg" id="modal">
        <form class="modal" id="form">
          <h3>Invite staff</h3>
          <div class="field"><label for="n">Full Name</label><input id="n" required placeholder="Enter full name"></div>
          <div class="field"><label for="e">Email Address</label><input id="e" type="email" required placeholder="staff@businesscatalog.com"></div>
          <div class="field">
            <label for="r">Role</label>
            <select id="r">
              <option value="staff">Staff / Support</option>
              <option value="warehouse">Warehouse</option>
              <option value="admin">Manager / Admin</option>
            </select>
          </div>
          <div class="btn-row" style="margin:0">
            <button class="btn" type="submit">Save profile</button>
            <button type="button" class="btn outline" id="cancel">Cancel</button>
          </div>
        </form>
      </div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  async function fetchStaff() {
    if (!sb) {
      $('rows').innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center">Database connection unavailable.</td></tr>';
      return;
    }
    try {
      // Fetch users with staff/owner/admin roles from 'profiles' table
      const { data, error } = await sb.from('profiles').select('*').in('role', ['owner', 'staff', 'admin']);
      if (error) throw error;
      
      const list = data || [];
      if (list.length > 0) {
        $('rows').innerHTML = list.map(m => `
          <tr>
            <td><strong>${m.full_name || 'Staff Member'}</strong></td>
            <td><span class="badge">${m.role || 'staff'}</span></td>
            <td>${m.id.substring(0, 8)}... (ID)</td>
            <td><span class="badge">Active</span></td>
            <td>${m.role !== 'owner' ? `<button class="link-danger remove-btn" data-id="${m.id}" type="button">Demote/Remove</button>` : '<small class="muted">Owner</small>'}</td>
          </tr>
        `).join('');
      } else {
        $('rows').innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:20px">No staff profiles found.</td></tr>';
      }
    } catch (err) {
      console.error('Error fetching staff:', err);
      $('rows').innerHTML = '<tr><td colspan="5" class="text-danger" style="text-align:center">Failed to load staff list.</td></tr>';
    }
  }

  $('invite').onclick = () => $('modal').classList.add('open');
  $('cancel').onclick = () => $('modal').classList.remove('open');

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!sb) return;
    const name = $('n').value.trim();
    const email = $('e').value.trim();
    const role = $('r').value;

    try {
      // Create profile record in database
      const { error } = await sb.from('profiles').insert([{ full_name: name, role: role, account_type: 'staff' }]);
      if (error) throw error;
      
      toast('Staff profile added successfully!');
      $('modal').classList.remove('open');
      e.target.reset();
      fetchStaff();
    } catch (err) {
      console.error('Error adding staff:', err);
      toast('Failed to add staff member.');
    }
  });

  $('rows').addEventListener('click', async e => {
    const btn = e.target.closest('.remove-btn');
    if (btn && confirm('Are you sure you want to remove this staff member?')) {
      const id = btn.dataset.id;
      try {
        const { error } = await sb.from('profiles').update({ role: 'retail' }).eq('id', id);
        if (error) throw error;
        toast('Staff role revoked.');
        fetchStaff();
      } catch (err) {
        console.error('Error revoking role:', err);
        toast('Failed to update staff role.');
      }
    }
  });

  fetchStaff();
});
</script>
</body>
</html>
