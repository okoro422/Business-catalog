<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}h2{font-size:1.35rem}h3{font-size:1.05rem}h4{font-size:1rem}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.text-success{color:var(--success)}.text-warning{color:var(--warning)}.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}.btn.sm{padding:7px 14px;font-size:13px}

/* ---------- Forms ---------- */
.form-grid{display:grid;gap:14px;grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field input{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none;transition:.2s}
.field input:focus{border-color:var(--forest-700);box-shadow:0 0 0 3px var(--mint-200)}
.form-msg{font-size:13px;color:var(--danger);min-height:18px}

/* ---------- Auth ---------- */
body.auth{background:var(--forest-900);align-items:center;justify-content:center;padding:16px}
.auth-card{background:#fff;border-radius:var(--r-lg);padding:32px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:18px}
</style>
</head>
<body class="auth" data-layout="auth">
<main class="auth-card" id="main">
  <h1>Staff Portal</h1>
  <form class="stack" id="staffForm" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="email">Staff email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <p class="form-msg" id="msg" role="alert"></p>
    <button class="btn block" type="submit" id="submitBtn">Sign in</button>
  </form>
  <a href="index.html" class="small muted" style="text-align:center">← Back to store</a>
</main>

<script>
document.getElementById('staffForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const emailInput = document.getElementById('email').value.trim();
  const passwordInput = document.getElementById('password').value.trim();
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  
  msgEl.style.color = 'var(--danger)';
  msgEl.textContent = '';

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  // Obtain Supabase database client instance
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  if (!sb) {
    msgEl.textContent = 'Database client initializing. Please wait a moment and try again.';
    btn.disabled = false;
    btn.textContent = 'Sign in';
    return;
  }

  try {
    // 1. Authenticate credentials
    const { data, error } = await sb.auth.signInWithPassword({
      email: emailInput,
      password: passwordInput,
    });

    if (error) throw error;

    // 2. Check profile role in database
    const { data: profile, error: profError } = await sb
      .from('profiles')
      .select('account_type, role')
      .eq('id', data.user.id)
      .maybeSingle();

    const role = (profile && (profile.role || profile.account_type)) || 'retail';

    if (role !== 'staff' && role !== 'admin') {
      // Reject non-staff accounts and sign out
      await sb.auth.signOut();
      throw new Error('Access denied. This account does not have staff permissions.');
    }

    msgEl.style.color = 'var(--success)';
    msgEl.textContent = 'Access granted! Redirecting to dashboard...';

    setTimeout(() => {
      window.location.href = 'admin-dashboard.html';
    }, 600);

  } catch (err) {
    msgEl.style.color = 'var(--danger)';
    msgEl.textContent = err.message || 'Login failed.';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
