<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --tabbar:64px;--max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.3rem,3vw,1.9rem)}h2{font-size:1.35rem}h3{font-size:1.05rem}h4{font-size:1rem}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.text-success{color:var(--success)}.text-warning{color:var(--warning)}.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Shop shell ---------- */
.announcement{background:var(--forest-900);color:#fff;text-align:center;font-size:12px;font-weight:500;padding:8px 16px}
.site-header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-inner{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink-900);white-space:nowrap}
.desktop-nav{display:none;gap:20px;font-weight:500}
.desktop-nav a{padding:4px 0;border-bottom:2px solid transparent}
.desktop-nav a:hover,.desktop-nav a.active{border-color:var(--forest-700);color:var(--ink-900)}
.header-search{display:none;flex:1;position:relative;max-width:420px}
.header-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-500)}
.header-search input{width:100%;height:40px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--cream-100);padding:0 16px 0 38px;font:inherit;outline:none}
.header-search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--forest-700);box-shadow:0 0 0 3px var(--mint-200)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.icon-link{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r-pill);background:none;border:0;cursor:pointer;color:var(--ink-900);font:inherit;font-size:13px}
.icon-link:hover{background:var(--cream-100)}
.icon-link i{font-size:16px}
.icon-link .lbl{display:none}
.badge-dot{background:var(--forest-700);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.mobile-search{display:none;padding:10px 16px;border-top:1px solid var(--border);gap:8px}
.mobile-search.open{display:flex}
.mobile-search input{flex:1;height:40px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--cream-100);padding:0 16px;font:inherit}
.container{width:100%;max-width:var(--max);margin:0 auto;padding:16px;flex:1}
.container.narrow{max-width:900px}.container.xnarrow{max-width:520px}
.site-footer{border-top:1px solid var(--border);padding:24px 20px;text-align:center;font-size:12px;color:var(--ink-500)}
.site-footer a{margin:0 8px;text-decoration:underline}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:var(--tabbar);background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:60}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-500);flex:1;padding:6px 0;background:none;border:0;cursor:pointer}
.tabbar i{font-size:17px}.tabbar .active{color:var(--forest-700);font-weight:700}
body.has-tabbar{padding-bottom:var(--tabbar)}

/* Bottom sheet menu (mobile "Menu" / admin "More") */
.sheet{position:fixed;inset:0;background:rgba(15,42,29,.5);z-index:95;display:none}
.sheet.open{display:block}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.sheet-panel h3{margin-bottom:6px}
.sheet-panel a{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--border);font-weight:500;color:var(--ink-900)}
.sheet-panel a:last-child{border-bottom:0}
.sheet-panel a i{width:20px;text-align:center;color:var(--forest-700)}
.sheet-panel a.active{color:var(--forest-700);font-weight:700}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center;width:100%}
.btn:hover{background:var(--forest-800)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn.white{background:#fff;color:var(--forest-900);border-color:#fff}
.btn.ghost-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn.block{width:100%}.btn.sm{padding:8px 14px;font-size:13px;width:auto}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.add-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--forest-700);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.add-btn:hover{background:var(--forest-600)}
.link-danger{background:none;border:0;color:var(--danger);font:600 12px var(--font-body);cursor:pointer;text-decoration:underline}

/* ---------- Cards, grids (Mobile-First Scalability) ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-1);width:100%;overflow:hidden}
a.card:hover{border-color:var(--sage-300)}
.stack{display:flex;flex-direction:column;gap:16px;width:100%}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px;width:100%}
.grid.cols-2{grid-template-columns:1fr}
.split{display:grid;gap:16px;grid-template-columns:1fr;width:100%}
.page-head{margin-bottom:16px}.page-head p{color:var(--ink-500);margin-top:4px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}

/* ---------- Forms & Inputs (Mobile friendly sizing) ---------- */
.form-grid{display:grid;gap:14px;grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px;width:100%}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field input,.field select,.field textarea{width:100%;padding:12px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none;transition:.2s;-webkit-appearance:none;appearance:none}
.field input.err,.field select.err{border-color:var(--danger)}
.field.full{grid-column:1/-1}.full{grid-column:1/-1}
.form-msg{font-size:13px;color:var(--danger);min-height:18px}
.sel{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;font:inherit;color:var(--ink-900);cursor:pointer;width:100%}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px;line-height:1.4}
.check input[type="checkbox"]{width:18px;height:18px;accent-color:var(--forest-700)}

/* ---------- Tables ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-1);width:100%}
table{width:100%;border-collapse:collapse;text-align:left;min-width:320px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}

/* ---------- Admin shell ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column;width:100%}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-top .t{font-weight:700;color:var(--ink-900)}
.admin-top .u{display:flex;gap:10px;font-size:12px;color:var(--ink-500);flex-wrap:wrap;justify-content:flex-end}
.admin-top .u a:hover{color:var(--forest-700)}
.admin-content{padding:16px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:16px;margin:0 auto}

/* Tablet & Desktop Breakpoints */
@media(min-width:640px){
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .admin-content{padding:24px}
}

@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}
  .admin-content{padding:28px 32px}
  body.admin-body .tabbar{display:none}
  .split.sidebar-right{grid-template-columns:1fr 340px;align-items:start;gap:24px}
  .form-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body data-layout="admin" data-section="products" data-title="Products">
<main id="main">
  <div class="row-between"><h1 id="h">Add product</h1><a class="muted" href="admin-products.html">← All products</a></div>
  <form id="form" class="split sidebar-right" novalidate>
    <div class="stack">
      <div class="card">
        <div class="form-grid">
          <div class="field full"><label for="name">Name</label><input id="name"></div>
          <div class="field"><label for="sku">SKU</label><input id="sku"></div>
          <div class="field"><label for="cat">Category</label><select id="cat"><option value="skincare">Skincare</option><option value="hair">Hair</option><option value="bath-body">Bath &amp; Body</option><option value="toiletries">Toiletries</option></select></div>
          <div class="field"><label for="brand">Brand</label><input id="brand" value="Natural Essentials"></div>
          <div class="field"><label for="price">Retail price (₦)</label><input id="price" inputmode="numeric"></div>
          <div class="field"><label for="cost">Cost (₦)</label><input id="cost" inputmode="numeric"></div>
          <div class="field"><label for="stock">Stock on hand</label><input id="stock" inputmode="numeric" value="0"></div>
          <div class="field"><label for="reorder">Reorder level</label><input id="reorder" inputmode="numeric" value="20"></div>
        </div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Pack</th><th>Units</th><th>Price/unit (₦)</th></tr></thead><tbody>
        <tr><td>Dozen</td><td>12</td><td><input class="sel" id="t12" inputmode="numeric"></td></tr>
        <tr><td>48 pcs</td><td>48</td><td><input class="sel" id="t48" inputmode="numeric"></td></tr>
        <tr><td>Carton</td><td>96</td><td><input class="sel" id="t96" inputmode="numeric"></td></tr></tbody></table></div>
      <p class="form-msg" id="msg" role="alert"></p>
    </div>
    
    <div class="stack">
      <div class="card stack" style="gap:10px">
        <div class="field"><label for="status">Status</label><select id="status"><option>Active</option><option>Hidden</option><option>Draft</option></select></div>
        
        <!-- Publishing options to control where the product appears -->
        <div class="field" style="margin-top:6px;">
          <label>Where do you want to publish this product?</label>
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
            <label class="check"><input type="checkbox" id="isFeatured" checked> Feature on Homepage (`index.html`)</label>
            <label class="check"><input type="checkbox" id="isShop" checked> Publish to Shop Catalog (`shop.html`)</label>
          </div>
        </div>
      </div>
      
      <div class="card stack" style="gap:10px">
        <strong>Product image</strong>
        <div class="upload-prev" id="prev" style="min-height:120px; background:var(--mint-50); border:1px dashed var(--border); border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; color:var(--ink-500); font-size:24px;"><i class="fa-solid fa-image"></i></div>
        <label for="file" class="btn outline sm" style="cursor:pointer; width:100%; text-align:center;">Upload from device</label><input type="file" id="file" accept="image/*" hidden>
      </div>
      <button class="btn block" type="submit">Publish</button>
      <button class="btn outline block" type="button" id="draft">Save draft</button>
    </div>
  </form>
</main>

<script>
(function () {
  const body = document.body;
  const layout = body.dataset.layout || 'shop';      
  const section = body.dataset.section || '';        
  const title = body.dataset.title || '';            

  const SHOP_NAV = [['Shop', 'shop.html', 'shop'], ['Wholesale', 'wholesale.html', 'wholesale'], ['Supply request', 'supply-request.html', 'supply']];
  const ADMIN_NAV = [
    ['Dashboard', 'admin-dashboard.html', 'dashboard'], ['Products', 'admin-products.html', 'products'], ['Orders', 'admin-orders.html', 'orders'],
    ['Supply', 'admin-supply-requests.html', 'supply'], ['Customers', 'admin-customers.html', 'customers'], ['Inbox', 'admin-inbox.html', 'inbox'],
    ['Reports', 'admin-reports.html', 'reports'], ['Settings', 'admin-delivery-zones.html', 'settings']
  ];
  const ADMIN_TABS = [
    ['Dashboard', 'admin-dashboard.html', 'dashboard', 'fa-solid fa-chart-line'], ['Orders', 'admin-orders.html', 'orders', 'fa-solid fa-box-archive'],
    ['Inbox', 'admin-inbox.html', 'inbox', 'fa-regular fa-comment-dots'], ['Products', 'admin-products.html', 'products', 'fa-solid fa-store']
  ];
  const ADMIN_MENU = [
    ['Supply requests', 'admin-supply-requests.html', 'fa-solid fa-file-invoice', 'supply'], ['Customers', 'admin-customers.html', 'fa-regular fa-address-book', 'customers'],
    ['Reports', 'admin-reports.html', 'fa-solid fa-chart-column', 'reports'], ['Delivery zones & settings', 'admin-delivery-zones.html', 'fa-solid fa-truck', 'settings'],
    ['Categories', 'admin-categories.html', 'fa-solid fa-tags', ''], ['Staff and roles', 'admin-staff.html', 'fa-solid fa-user-shield', ''],
    ['Activity log', 'admin-activity-log.html', 'fa-solid fa-clock-rotate-left', ''], ['View store', 'index.html', 'fa-solid fa-shop', ''],
    ['Sign out', 'staff-login.html', 'fa-solid fa-right-from-bracket', '']
  ];

  const cls = k => (k && k === section ? 'active' : '');
  const links = arr => arr.map(([t, h, k]) => `<a href="${h}" class="${cls(k)}">${t}</a>`).join('');
  const tabs = arr => arr.map(([t, h, k, i]) => `<a href="${h}" class="${cls(k)}"><i class="${i}"></i><span>${t}</span></a>`).join('');

  function adminShell(main) {
    const wrap = document.createElement('div');
    wrap.className = 'admin-main';
    wrap.innerHTML = `
      <header class="admin-top">
        <span class="t">${title}</span>
        <div class="u"><a href="admin-orders.html">Orders</a><a href="admin-activity-log.html">Alerts</a><a href="admin-staff.html">Staff</a><a href="index.html">View store</a><a href="staff-login.html">Sign out</a></div>
      </header>`;
    main.classList.add('admin-content');
    main.parentNode.insertBefore(wrap, main);
    wrap.appendChild(main);
    const side = document.createElement('aside');
    side.className = 'admin-side';
    side.innerHTML = `<a href="admin-dashboard.html" class="brand">Business Catalog</a><nav>${links(ADMIN_NAV)}</nav>`;
    body.insertBefore(side, wrap);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const main = document.getElementById('main');
    if (layout === 'admin' && main) { body.classList.add('admin-body'); adminShell(main); }
  });
})();
</script>
<script>
/* Admin Product Form Handler with Supabase */
(function () {
  const $ = id => document.getElementById(id);
  const urlParams = new URLSearchParams(location.search);
  const productId = urlParams.get('id');
  let currentImgUrl = '';

  // Initialize Supabase client using global configuration
  const supabaseClient = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  async function loadProductData() {
    if (!productId || !supabaseClient) return;
    try {
      const { data, error } = await supabaseClient.from('products').select('*').eq('id', productId).single();
      if (data && !error) {
        $('h').textContent = 'Edit: ' + data.name;
        if ($('name')) $('name').value = data.name || '';
        if ($('sku')) $('sku').value = data.sku || 'SKU-' + data.id;
        if ($('cat')) $('cat').value = data.cat || data.category_slug || 'skincare';
        if ($('brand')) $('brand').value = data.brand || 'Natural Essentials';
        if ($('price')) $('price').value = data.price || '';
        if ($('cost')) $('cost').value = data.cost || '';
        if ($('stock')) $('stock').value = data.stock || 0;
        if ($('reorder')) $('reorder').value = data.reorder_level || 20;
        if ($('status')) $('status').value = data.status || 'Active';
        if ($('isFeatured')) $('isFeatured').checked = data.is_featured !== false && data.featured !== false;
        if ($('isShop')) $('isShop').checked = data.is_shop !== false;
        
        const imgVal = data.img || data.image_url;
        if (imgVal) {
          currentImgUrl = imgVal;
          $('prev').innerHTML = `<img src="${imgVal}" alt="${data.name}" style="width:100%; height:120px
