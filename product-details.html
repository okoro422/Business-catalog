<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Layout & Elements ---------- */
.announcement{background:var(--forest-900);color:#fff;text-align:center;font-size:12px;font-weight:500;padding:8px 16px}
.site-header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-inner{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink-900);white-space:nowrap}
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
a.card:hover{border-color:var(--sage-300)}
.stack{display:flex;flex-direction:column;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}

/* Buttons & Elements */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s}
.btn:hover{background:var(--forest-800)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.icon-link{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r-pill);background:none;border:0;cursor:pointer;color:var(--ink-900);font:inherit;font-size:13px}
.icon-link:hover{background:var(--cream-100)}

/* Product Page Specifics */
.pd-grid{display:grid;gap:28px;grid-template-columns:1fr}
.pd-main{background:var(--mint-50);border:1px solid var(--mint-100);border-radius:var(--r-lg);height:300px;display:flex;align-items:center;justify-content:center;font-size:96px;color:var(--forest-700);overflow:hidden}
.pd-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumb{width:72px;height:72px;border-radius:var(--r-md);background:var(--mint-50);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--forest-700);cursor:pointer}
.thumb.active{border-color:var(--forest-700)}
.tag{display:inline-block;background:var(--mint-100);color:var(--forest-700);border-radius:var(--r-pill);padding:3px 12px;font-size:12px;font-weight:600}
.pd-price{font:700 1.8rem var(--font-display);color:var(--ink-900)}
.seg{display:flex;background:var(--mint-100);padding:4px;border-radius:var(--r-pill)}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:var(--r-pill);font:600 14px var(--font-body);cursor:pointer;color:var(--ink-700)}
.seg button.active{background:var(--forest-700);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tier{border:1.5px solid var(--border);background:#fff;border-radius:var(--r-md);padding:12px;text-align:center;cursor:pointer;font-size:12px}
.tier b{display:block;font-size:1.05rem;color:var(--ink-900);margin-top:4px}
.tier.active{border-color:var(--forest-700);background:var(--mint-50)}
.tier.off{opacity:.4;pointer-events:none}
.stepper{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--r-pill);padding:4px;background:#fff}
.stepper button{width:34px;height:34px;border-radius:50%;border:0;background:var(--mint-100);color:var(--forest-700);font-size:18px;cursor:pointer}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper span{min-width:36px;text-align:center;font-weight:700}
.acc{border:1px solid var(--border);border-radius:var(--r-md);background:#fff;overflow:hidden}
.acc-item+.acc-item{border-top:1px solid var(--border)}
.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:none;border:0;font:600 14px var(--font-body);color:var(--ink-900);cursor:pointer;text-align:left}
.acc-body{display:none;padding:0 16px 14px}
.acc-item.open .acc-body{display:block}
.acc-item.open .acc-head i{transform:rotate(180deg)}
.buy-bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:20}
.badge{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--mint-100);color:var(--forest-700);border:1px solid var(--sage-300)}
.badge.warn{background:#FEF3C7;color:#92400E;border-color:#F5DFA0}
.badge.danger{background:#FBE7E3;color:var(--danger);border-color:#F0C4BC}

@media(min-width:900px){
  .pd-grid{grid-template-columns:1fr 1fr;align-items:start}
  .desktop-only{display:inline-flex!important}
}
@media(max-width:899px){.desktop-only{display:none!important}}
</style>
</head>
<body data-layout="shop" data-section="shop">
<main class="container" id="main"><div id="pd"><div class="empty">Loading product...</div></div></main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const root = document.getElementById('pd');
  const productId = new URLSearchParams(location.search).get('id');

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const tiers = p => [
    { label: 'Dozen', qty: 12, price: Math.round(p * .83 / 10) * 10 },
    { label: '48 pcs · Save 25%', qty: 48, price: Math.round(p * .75 / 10) * 10 },
    { label: 'Carton', qty: 96, price: Math.round(p * .68 / 10) * 10 }
  ];

  if (!productId || !sb) {
    root.innerHTML = '<div class="empty"><h2>Product not found</h2><p style="margin:8px 0 20px">It may have been removed or database connection failed.</p><a class="btn" href="shop.html">Back to shop</a></div>';
    return;
  }

  // Fetch live product from Supabase
  let p = null;
  try {
    const { data, error } = await sb.from('products').select('*').eq('id', productId).single();
    if (error || !data) throw error;
    p = Object.assign({}, data, { tiers: tiers(data.price) });
  } catch (err) {
    console.error('Error fetching product:', err);
    root.innerHTML = '<div class="empty"><h2>Product not found</h2><p style="margin:8px 0 20px">The requested item does not exist.</p><a class="btn" href="shop.html">Back to shop</a></div>';
    return;
  }

  document.title = p.name + ' — Business Catalog';
  const CAT = { skincare:'Skincare', hair:'Hair', 'bath-body':'Bath &amp; Body', toiletries:'Toiletries' };
  
  const INFO = {
    'bath-body': ['Rich, nourishing handmade bar crafted with pure unrefined shea butter to deeply hydrate and soothe dry skin. Ideal for daily family care and professional spa use.', 'Butyrospermum Parkii (Shea Butter), Cocos Nucifera (Coconut) Oil, Aqua, Sodium Hydroxide, Natural Plant Extracts.', 'Work into a rich lather with water, massage gently over face and body, then rinse thoroughly with clean water.'],
    skincare: ['Gentle, effective skincare made for everyday use on all skin types.', 'Aqua, Glycerin, Plant Extracts, Natural Preservatives.', 'Apply a small amount to clean skin and massage gently until absorbed.'],
    hair: ['Nourishing hair care that adds moisture, shine and strength.', 'Aqua, Natural Oils, Plant Extracts, Natural Preservatives.', 'Apply to damp or dry hair, style as usual.'],
    toiletries: ['Everyday essentials for the whole family, available in bulk for shops and salons.', 'See product packaging for the full ingredients list.', 'Use as directed on the packaging.']
  };
  
  const text = INFO[p.cat] || INFO['toiletries'];
  const icons = [p.icon || 'fa-pump-soap', 'fa-bottle-droplet'].filter((v, i, a) => a.indexOf(v) === i).slice(0, 3);
  const canWholesale = (p.stock || 0) >= 12;
  let mode = 'single', qty = 1;

  root.innerHTML = `
  <div class="row-between" style="margin-bottom:16px">
    <a class="muted" href="shop.html"><i class="fa-solid fa-arrow-left"></i> Back to shop</a>
    <a class="muted" href="cart.html">Cart</a>
  </div>
  <div class="pd-grid">
    <div>
      <div class="pd-main" id="mainIcon">
        ${p.img ? `<img src="${p.img}" alt="${p.name}">` : `<i class="fa-solid ${p.icon || 'fa-pump-soap'}"></i>`}
      </div>
    </div>
    <div class="stack">
      <div class="row-between"><span class="tag">${CAT[p.cat] || 'General'}</span><button class="icon-link" id="save" type="button" aria-label="Save item"><i class="fa-regular fa-heart"></i><span class="lbl">Save</span></button></div>
      <h1>${p.name}</h1>
      <div class="row-between"><div class="pd-price" id="unit"></div><span class="badge" id="stockBadge"></span></div>
      <div class="seg" id="modeSeg"><button type="button" class="active" data-m="single">Single</button><button type="button" data-m="wholesale" ${canWholesale ? '' : 'disabled title="Not enough stock for wholesale"'}>Wholesale</button></div>
      <div class="tiers hidden" id="tiers">${p.tiers.map(t => `<div class="tier ${t.qty > (p.stock || 0) ? 'off' : ''}" data-q="${t.qty}">${t.label}<b>${naira(t.price)}</b></div>`).join('')}</div>
      <div class="row-between"><strong>Quantity</strong>
        <div class="stepper"><button type="button" id="minus" aria-label="Decrease">−</button><span id="qty">1</span><button type="button" id="plus" aria-label="Increase">+</button></div></div>
      <div class="acc" id="acc">
        ${[['Description', text[0]], ['Ingredients', text[1]], ['How to use', text[2]], ['Delivery', 'Same-day or next-day delivery available within Abuja. Free delivery applies to Zone A orders over ₦50,000.']]
          .map((a, i) => `<div class="acc-item ${i === 0 ? 'open' : ''}"><button type="button" class="acc-head">${a[0]} <i class="fa-solid fa-chevron-down"></i></button><div class="acc-body">${a[1]}</div></div>`).join('')}
      </div>
      <a class="card row-between" href="chat.html?product=${p.id}"><span>Ask about this product (chat)</span><i class="fa-solid fa-arrow-right"></i></a>
      <div class="buy-bar">
        <div><div class="small muted">Total</div><div class="price" id="total"></div></div>
        <div style="display:flex;gap:10px">
          <a href="chat.html?product=${p.id}" class="btn outline desktop-only">Ask in chat</a>
          <a href="cart.html" class="btn outline desktop-only">View cart</a>
          <button class="btn" id="addBtn" type="button">Add to cart</button>
        </div>
      </div>
    </div>
  </div>`;

  const $ = id => document.getElementById(id);
  const minQty = m => (m === 'wholesale' ? 12 : 1);
  const priceFor = (prod, q, m) => {
    if (m !== 'wholesale' || !prod.tiers) return prod.price;
    const t = prod.tiers.filter(item => q >= item.qty).pop();
    return t ? t.price : prod.price;
  };

  function update() {
    const unit = priceFor(p, qty, mode);
    $('unit').textContent = naira(unit) + (mode === 'wholesale' ? ' / unit' : '');
    $('qty').textContent = qty;
    $('total').textContent = naira(unit * qty);
    $('tiers').classList.toggle('hidden', mode !== 'wholesale');
    const active = p.tiers.filter(t => qty >= t.qty && t.qty <= (p.stock || 0)).pop();
    document.querySelectorAll('.tier').forEach(t => t.classList.toggle('active', mode === 'wholesale' && active && +t.dataset.q === active.qty));
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.m === mode));
    
    const stock = p.stock || 0;
    const b = $('stockBadge');
    b.className = 'badge' + (stock < 1 ? ' danger' : stock <= 10 ? ' warn' : '');
    b.textContent = stock < 1 ? 'Out of stock' : stock <= 10 ? 'Low stock - ' + stock : 'In stock - ' + stock;
    $('plus').disabled = qty >= stock; 
    $('minus').disabled = qty <= minQty(mode);
    $('addBtn').disabled = stock < 1; 
    if (stock < 1) $('addBtn').textContent = 'Out of stock';
  }

  const clamp = () => { qty = Math.max(minQty(mode), Math.min(p.stock || 0, qty)); };
  
  $('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    mode = b.dataset.m;
    qty = mode === 'wholesale' ? (p.tiers.filter(t => t.qty <= (p.stock || 0))[1] || p.tiers[0]).qty : 1;
    clamp(); update();
  });

  $('tiers').addEventListener('click', e => { const t = e.target.closest('.tier'); if (t) { qty = +t.dataset.q; clamp(); update(); } });
  $('minus').addEventListener('click', () => { qty--; clamp(); update(); });
  $('plus').addEventListener('click', () => { qty++; clamp(); update(); });
  $('acc').addEventListener('click', e => { const h = e.target.closest('.acc-head'); if (h) h.parentElement.classList.toggle('open'); });

  $('addBtn').addEventListener('click', async () => {
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) {
        location.href = 'signin.html';
        return;
      }

      const unitPrice = priceFor(p, qty, mode);
      const cartKey = p.id + '|' + mode;

      // Check if already in cart_items table in Supabase
      const { data: existing } = await sb.from('cart_items').select('*').eq('user_id', user.id).eq('product_id', p.id).eq('mode', mode).single();

      if (existing) {
        await sb.from('cart_items').update({ qty: Math.min(p.stock, existing.qty + qty), price: unitPrice }).eq('id', existing.id);
      } else {
        await sb.from('cart_items').insert({ user_id: user.id, product_id: p.id, mode: mode, qty: qty, price: unitPrice });
      }

      const btn = $('addBtn');
      btn.textContent = 'Added ✓';
      setTimeout(() => btn.textContent = 'Add to cart', 1500);
    } catch (err) {
      console.error('Error adding to cart:', err);
    }
  });

  update();
});
</script>
</body>
</html>
