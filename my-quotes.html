<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Quotes — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
body{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Layout & Elements ---------- */
.announcement{background:var(--forest-900);color:#fff;text-align:center;font-size:12px;font-weight:500;padding:8px 16px}
.site-header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-inner{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink-900);white-space:nowrap}
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.container.narrow{max-width:900px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1);cursor:pointer}
.card:hover{border-color:var(--sage-300)}
.stack{display:flex;flex-direction:column;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.price{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}

/* Tabs & Badges */
.tabs{display:flex;background:var(--mint-100);padding:5px;border-radius:var(--r-pill);margin-bottom:20px;overflow-x:auto;gap:4px}
.tab{flex:1;white-space:nowrap;background:none;border:0;padding:9px 14px;border-radius:var(--r-pill);font:500 13px var(--font-body);color:var(--ink-700);cursor:pointer;text-align:center}
.tab.active{background:var(--forest-700);color:#fff;font-weight:700}
.badge{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--mint-100);color:var(--forest-700);border:1px solid var(--sage-300)}
.badge.gray{background:var(--cream-100);color:var(--ink-500);border-color:var(--border)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s}
.btn:hover{background:var(--forest-800)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
</style>
</head>
<body data-layout="shop" data-section="quotes">
<main class="container narrow" id="main">
  <div class="row-between page-head">
    <h1>My Quotes</h1>
    <a class="btn sm" href="supply-request.html">+ New request</a>
  </div>
  <div class="tabs" id="tabs">
    <button type="button" class="tab active" data-f="all">All</button>
    <button type="button" class="tab" data-f="Approved">Approved</button>
    <button type="button" class="tab" data-f="In review">In review</button>
    <button type="button" class="tab" data-f="Converted">Converted</button>
    <button type="button" class="tab" data-f="Declined">Declined</button>
  </div>
  <div class="stack" id="list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px">
    <div class="empty">Loading your quotes...</div>
  </div>
  <div class="btn-row">
    <label class="small muted" for="paymentMethod">Payment
      <select id="paymentMethod" class="tab" style="display:block;margin-top:4px">
        <option value="online">Online</option><option value="cash">Cash on delivery</option><option value="transfer">Transfer</option>
      </select>
    </label>
    <button class="btn" id="convert" type="button" disabled>Convert to order</button>
    <a class="btn outline" id="nego" href="chat.html">Message us</a>
  </div>
  <p class="small muted" id="quoteMsg" role="status" style="margin-top:8px">Select an approved quote to convert it to an order or message our team.</p>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');
  let f = 'all', sel = null, quotesList = [];
  let loadError = '';

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const meta = q => q.status === 'Approved' ? `${naira(q.total || 0)} · valid until ${q.valid_until || 'date not set'}` : q.status === 'Converted' ? `Order ${q.converted_order_id || 'created'}` : q.status === 'Declined' ? 'This request was declined' : 'Our team is reviewing this request';
  const badgeCls = s => (s === 'Approved' || s === 'Converted') ? '' : 'gray';

  function render() {
    const list = quotesList.filter(q => f === 'all' || q.status === f);
    
    document.getElementById('list').innerHTML = loadError
      ? `<div class="empty"><h3>We couldn't load your quotes</h3><p>${esc(loadError)}</p><button class="btn" type="button" onclick="location.reload()">Try again</button></div>`
      : list.length ? list.map(q => `
      <article class="card stack" data-id="${esc(q.id)}" style="gap:10px;cursor:pointer;${sel === q.id ? 'border-color:var(--forest-700);background:var(--mint-50)' : ''}">
        <div class="row-between"><strong>${esc(q.id || 'SR-000')}</strong><span class="badge ${badgeCls(q.status)}">${esc(q.status || 'In review')}</span></div>
        <strong>${esc(q.title || 'Custom supply request')}</strong>
        <div class="small muted">${esc(q.business_name || '')}</div>
        <div class="small muted">${(q.items || []).map(item => `${esc(item.qty)} × ${esc(item.name)} (${esc(item.pack)})`).join('<br>') || 'Request items'}</div>
        <div class="small muted">${esc(meta(q))}</div>
        ${q.status === 'Approved' ? `<strong class="price">${naira(q.total || 0)}</strong>` : ''}
      </article>`).join('')
      : '<div class="empty"><h3>No quotes here</h3><p style="margin:8px 0 18px">Request a wholesale quote and our team will reply within 24 hours.</p><a class="btn" href="supply-request.html">Request a quote</a></div>';

    const selectedQuote = quotesList.find(x => x.id === sel);
    document.getElementById('convert').disabled = !(selectedQuote && selectedQuote.status === 'Approved');
    document.getElementById('nego').href = 'chat.html' + (selectedQuote ? '?quote=' + encodeURIComponent(selectedQuote.id) : '');
  }

  async function fetchQuotes() {
    if (!sb) {
      quotesList = [];
      loadError = 'The database connection is unavailable. Check your connection and try again.';
      render();
      return;
    }

    try {
      const { data: { session }, error: authError } = await sb.auth.getSession();
      if (authError) throw authError;
      const user = session && session.user;
      if (!user) {
        location.href = 'signin.html';
        return;
      }

      const { data, error } = await sb
        .from('supply_requests')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error) throw error;
      loadError = '';
      const requestIds = (data || []).map(quote => quote.id);
      let items = [];
      if (requestIds.length) {
        const { data: itemData, error: itemError } = await sb.from('supply_request_items')
          .select('request_id,product_id,custom_description,pack,qty').in('request_id', requestIds);
        if (itemError) throw itemError;
        items = itemData || [];
      }
      const productIds = [...new Set(items.map(item => item.product_id).filter(Boolean))];
      let products = [];
      if (productIds.length) {
        const { data: productData, error: productError } = await sb.from('products').select('id,name').in('id', productIds);
        if (productError) throw productError;
        products = productData || [];
      }

      const productNames = new Map(products.map(product => [product.id, product.name]));
      quotesList = (data || []).map(quote => {
        const quoteItems = items.filter(item => item.request_id === quote.id).map(item => Object.assign({}, item, {
          name: item.product_id ? productNames.get(item.product_id) || 'Unavailable product' : item.custom_description || 'Custom item'
        }));
        return Object.assign({}, quote, {
          title: quoteItems.slice(0, 2).map(item => item.name).join(' + ') || 'Custom supply request',
          status: quote.status === 'Quoted' ? 'Approved' : quote.status === 'Accepted' ? (quote.converted_order_id ? 'Converted' : 'Approved') : quote.status === 'New' ? 'In review' : quote.status,
          items: quoteItems
        });
      });
    } catch (err) {
      console.error('Error fetching live quotes:', err);
      quotesList = [];
      loadError = err.message || 'Please try again.';
    }
    render();
  }

  fetchQuotes();

  document.getElementById('tabs').addEventListener('click', e => { 
    const b = e.target.closest('.tab'); 
    if (b) { 
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      b.classList.add('active');
      f = b.dataset.f;
      sel = null;
      render(); 
    } 
  });

  document.getElementById('list').addEventListener('click', e => { 
    const c = e.target.closest('[data-id]'); 
    if (c) { 
      sel = c.dataset.id; 
      render(); 
    } 
  });

  document.getElementById('convert').addEventListener('click', async () => {
    if (!sel || !sb) return;
    const button = document.getElementById('convert');
    button.disabled = true;
    document.getElementById('quoteMsg').textContent = '';
    try {
      const { data: orderId, error } = await sb.rpc('convert_supply_quote_to_order', {
        p_request_id: sel,
        p_method: document.getElementById('paymentMethod').value
      });
      if (error) throw error;
      if (!orderId) throw new Error('The new order could not be confirmed.');
      document.getElementById('quoteMsg').textContent = `Quote converted to order ${orderId}. Opening your orders…`;
      setTimeout(() => { location.href = 'my-orders.html?created=' + encodeURIComponent(orderId); }, 700);
    } catch (err) {
      console.error('Error converting quote to order:', err);
      document.getElementById('quoteMsg').textContent = err.message || 'Could not convert this quote to an order.';
      button.disabled = false;
    }
  });
});
</script>
</body>
</html>
