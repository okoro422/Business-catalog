<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}h2{font-size:1.35rem}
.muted{color:var(--ink-500)}.small{font-size:12px}.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Layout & Elements ---------- */
.container{width:100%;max-width:var(--max);margin:0 auto;padding:24px 16px;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:16px}
.split{display:grid;gap:24px;grid-template-columns:1fr}
.empty{text-align:center;padding:48px 16px;color:var(--ink-500)}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.line:last-child{border-bottom:0}.line.total{font-weight:700;font-size:1.05rem;color:var(--ink-900)}
.summary{position:sticky;top:90px}
.cstep{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.cstep span{padding:6px 16px;border-radius:var(--r-pill);background:var(--cream-100);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--ink-500)}
.cstep span.active{background:var(--forest-700);color:#fff;border-color:var(--forest-700)}
.cstep span.done{background:var(--mint-100);color:var(--forest-700)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 18px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;transition:.2s}
.opt:hover{border-color:var(--sage-300)}
.opt.active{border-color:var(--forest-700);background:var(--mint-50)}
.opt b{display:block;color:var(--ink-900)}
.badge{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--mint-100);color:var(--forest-700);border:1px solid var(--sage-300)}
.badge.gray{background:var(--cream-100);color:var(--ink-500);border-color:var(--border)}
.notice{background:var(--mint-100);border:1px solid var(--mint-200);border-radius:var(--r-md);padding:12px 16px;font-size:13px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}

@media(min-width:900px){
  .split.sidebar-right{grid-template-columns:1fr 340px;align-items:start}
}
</style>
</head>
<body data-layout="shop" data-section="">
<main class="container" id="main">
  <div class="cstep" id="steps"><span class="done">1 Delivery</span><span class="active">2 Payment</span><span>3 Review</span></div>
  <div class="split sidebar-right">
    <div>
      <section class="stack" id="stepPay">
        <div class="stack" style="gap:10px" id="methods"></div>
        <div class="btn-row" style="margin:0"><button class="btn" id="toReview" type="button">Continue to review</button><a class="btn outline" href="checkout.html">Back</a></div>
        <div class="notice" id="notice"></div>
      </section>
      <section class="stack hidden" id="stepReview">
        <h2>Review your order</h2>
        <div class="card stack" style="gap:4px" id="reviewCard"></div>
        <div class="btn-row" style="margin:0"><button class="btn" id="place" type="button">Place order</button><button class="btn outline" id="back" type="button">Back</button></div>
      </section>
    </div>
    <aside class="card summary stack" style="gap:6px" id="summary"></aside>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const $ = id => document.getElementById(id);

  function gate(msg, href, label) { 
    $('main').innerHTML = `<div class="empty"><h2>${msg}</h2><p style="margin:8px 0 20px">Complete the earlier checkout steps first.</p><a class="btn" href="${href}">${label}</a></div>`; 
  }

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');

  const ZONES = {
    A: { name: 'Zone A · Inner city', short: 'Zone A', fee: 1500, freeOver: 50000 },
    B: { name: 'Zone B · Mid ring', short: 'Zone B', fee: 2500 },
    C: { name: 'Zone C · Outer', short: 'Zone C', fee: 4500 }
  };

  const getFee = (z, sub) => {
    const zone = ZONES[z];
    if (!zone) return 0;
    return zone.freeOver && sub >= zone.freeOver ? 0 : zone.fee;
  };

  if (!sb) {
    gate('Authentication error', 'signin.html', 'Sign in');
    return;
  }

  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    location.href = 'signin.html';
    return;
  }

  const rawInfo = sessionStorage.getItem('bc_checkout_payload');
  if (!rawInfo) {
    gate('Please add your delivery details first', 'checkout.html', 'Go to checkout');
    return;
  }

  const info = JSON.parse(rawInfo);

  // Fetch live cart items from Supabase
  let cartItems = [];
  try {
    const { data, error } = await sb.from('cart_items').select('*, products(*)').eq('user_id', user.id);
    if (error) throw error;
    cartItems = data || [];
  } catch (err) {
    console.error('Error fetching cart:', err);
  }

  if (!cartItems.length) {
    gate('Your cart is empty', 'shop.html', 'Go to shop');
    return;
  }

  let subtotal = cartItems.reduce((acc, item) => {
    const p = item.products || {};
    const price = item.price || p.price || 0;
    return acc + (price * item.qty);
  }, 0);

  const z = info.zone || 'A';
  const fee = getFee(z, subtotal);
  const total = subtotal + fee;

  const M = { online: ['Pay online now', 'Card or instant bank transfer'], cash: ['Pay on delivery (cash)', 'Pay the rider in cash'], transfer: ['Transfer on delivery', 'Bank transfer at handover'] };
  let method = sessionStorage.getItem('bc_pay_method') || 'online';

  const drawMethods = () => {
    $('methods').innerHTML = Object.keys(M).map(k => `<button type="button" class="opt ${k === method ? 'active' : ''}" data-m="${k}"><span><b>${M[k][0]}</b><span class="small muted">${M[k][1]}</span></span><span class="badge ${k === method ? '' : 'gray'}">${k === method ? 'Selected' : 'Choose'}</span></button>`).join('');
    $('notice').textContent = method === 'online' ? 'You will complete your card or bank transfer payment securely after placing the order.' : 'Cash and transfer orders are confirmed by our team before dispatch.';
  };

  $('methods').addEventListener('click', e => { 
    const b = e.target.closest('[data-m]'); 
    if (b) { 
      method = b.dataset.m; 
      sessionStorage.setItem('bc_pay_method', method);
      drawMethods(); 
    } 
  });

  const rowsHtml = cartItems.map(item => {
    const p = item.products || {};
    const price = item.price || p.price || 0;
    return `<div class="line"><span>${item.qty} × ${p.name || 'Product'}</span><strong>${naira(price * item.qty)}</strong></div>`;
  }).join('');

  $('summary').innerHTML = `<h3 style="margin-bottom:6px">Order summary</h3>
    ${rowsHtml}
    <div class="line"><span>Delivery · ${ZONES[z].name}</span><strong>${fee ? naira(fee) : 'Free'}</strong></div>
    <div class="line total"><span>Total</span><span>${naira(total)}</span></div>`;

  const go = review => {
    $('stepPay').classList.toggle('hidden', review); 
    $('stepReview').classList.toggle('hidden', !review);
    const s = document.querySelectorAll('#steps span');
    s[1].className = review ? 'done' : 'active'; 
    s[2].className = review ? 'active' : '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  $('toReview').addEventListener('click', () => {
    sessionStorage.setItem('bc_pay_method', method);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    
    $('reviewCard').innerHTML = `
      <div class="line"><span>Contact</span><strong>${esc(info.name)} · ${esc(info.phone)}</strong></div>
      <div class="line"><span>Delivery</span><strong>${ZONES[z].name} · ${esc(info.area)}</strong></div>
      <div class="line"><span>Address</span><strong>${esc(info.street)}${info.landmark ? ' (' + esc(info.landmark) + ')' : ''}</strong></div>
      <div class="line"><span>Payment</span><strong>${M[method][0]}</strong></div>` +
      rowsHtml +
      `<div class="line total"><span>Total</span><span>${naira(total)}</span></div>`;
    go(true);
  });

  $('back').addEventListener('click', () => go(false));

  $('place').addEventListener('click', async e => {
    e.target.disabled = true;
    e.target.textContent = 'Placing order...';

    try {
      // 1. Insert into Supabase `orders` table
      const { data: orderData, error: orderErr } = await sb.from('orders').insert({
        user_id: user.id,
        customer_name: info.name,
        phone: info.phone,
        zone: ZONES[z].name,
        area: info.area,
        street: info.street,
        landmark: info.landmark || '',
        payment_method: method,
        subtotal: subtotal,
        delivery_fee: fee,
        total: total,
        status: 'Placed'
      }).select().single();

      if (orderErr) throw orderErr;

      // 2. Insert corresponding order items into Supabase `order_items` table
      const orderItemsPayload = cartItems.map(item => {
        const p = item.products || {};
        const price = item.price || p.price || 0;
        return {
          order_id: orderData.id,
          product_id: item.product_id,
          name: p.name || 'Product',
          qty: item.qty,
          price: price,
          total: price * item.qty
        };
      });

      const { error: itemsErr } = await sb.from('order_items').insert(orderItemsPayload);
      if (itemsErr) throw itemsErr;

      // 3. Clear user's live cart items from Supabase
      const { error: clearErr } = await sb.from('cart_items').delete().eq('user_id', user.id);
      if (clearErr) console.error('Error clearing cart:', clearErr);

      // Save order id to session storage for receipt page
      sessionStorage.setItem('bc_last_order_id', orderData.id);
      location.href = 'receipt.html';
    } catch (err) {
      console.error('Error placing order:', err);
      alert('Failed to place order. Please try again.');
      e.target.disabled = false;
      e.target.textContent = 'Place order';
    }
  });

  drawMethods();
});
</script>
</body>
</html>
