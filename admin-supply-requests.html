<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Requests — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}
.badge{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--mint-100);color:var(--forest-700);border:1px solid var(--sage-300)}
.badge.gray{background:var(--cream-100);color:var(--ink-500);border-color:var(--border)}

/* ---------- Tables & Layout ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}tr.clickable:hover{background:var(--mint-50)}
.sub-section-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:var(--cream-100);border:1px solid var(--border);color:var(--ink-500);padding:8px 16px;border-radius:var(--r-pill);font:600 12px var(--font-body);white-space:nowrap;cursor:pointer;transition:.2s;display:inline-block}
.pill.active{background:var(--forest-700);border-color:var(--forest-700);color:#fff}

body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}.admin-content{padding:28px 32px}
}
@media print{.admin-side,.admin-top{display:none!important}}
</style>
</head>
<body data-layout="admin" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html" class="active">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Supply Requests</strong>
      <a href="admin-dashboard.html" class="small muted">← Dashboard</a>
    </header>

    <main class="admin-content">
      <h1>Supply &amp; Wholesale Requests</h1>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Request ID</th><th>Business / Client</th><th>Status</th><th>Quantity</th><th>Date</th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="muted" style="text-align:center;padding:20px">Loading live requests from Supabase...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const rowsEl = document.getElementById('rows');

  if (!sb) {
    rowsEl.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center">Database connection unavailable.</td></tr>';
    return;
  }

  try {
    const { data, error } = await sb.from('supply_requests').select('*').order('created_at', { ascending: false });
    if (error) throw error;

    const list = data || [];
    if (list.length > 0) {
      rowsEl.innerHTML = list.map(r => `
        <tr class="clickable" data-href="admin-supply-quote.html?id=${r.id}">
          <td><strong>#${r.id}</strong></td>
          <td>${r.business_name || 'Client'}</td>
          <td><span class="badge">${r.status || 'New'}</span></td>
          <td>${r.quantity || 1}</td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleDateString() : 'Recent'}</td>
        </tr>
      `).join('');
    } else {
      rowsEl.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:20px">No supply requests found in database.</td></tr>';
    }
  } catch (err) {
    console.error('Error fetching supply requests:', err);
    rowsEl.innerHTML = '<tr><td colspan="5" class="text-danger" style="text-align:center">Failed to load live supply requests.</td></tr>';
  }

  // Handle clickable rows
  document.addEventListener('click', e => {
    const row = e.target.closest('[data-href]');
    if (row) location.href = row.dataset.href;
  });
});
</script>
</body>
</html>
