<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Quote Builder — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<style>
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
  --max:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink-900);line-height:1.2}
h1{font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}
.text-danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2);max-width:90vw;text-align:center}

/* ---------- Buttons & Cards ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-pill);border:1px solid var(--forest-700);background:var(--forest-700);color:#fff;font:600 14px var(--font-body);cursor:pointer;transition:.2s;text-align:center}
.btn:hover{background:var(--forest-800)}
.btn.outline{background:transparent;color:var(--forest-700)}.btn.outline:hover{background:var(--mint-100)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1)}
.stack{display:flex;flex-direction:column;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.form-grid{display:grid;gap:14px;grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-500)}
.field input,.field select{width:100%;padding:12px 14px;background:var(--cream-100);border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:var(--ink-900);outline:none}
.field.full{grid-column:1/-1}
.form-msg{font-size:13px;color:var(--danger);min-height:18px}
.sel{padding:8px 14px;border:1px solid var(--border);border-radius:var(--r-pill);background:#fff;font:inherit;color:var(--ink-900);cursor:pointer}

/* ---------- Tables ---------- */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}

/* ---------- Admin Shell ---------- */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

@media(min-width:900px){
  .admin-side{display:block}
  .admin-top{padding:16px 32px}.admin-content{padding:28px 32px}
  .form-grid{grid-template-columns:1fr 1fr}
}
@media print{.admin-side,.admin-top{display:none!important}}
</style>
</head>
<body data-layout="admin" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html" class="active">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Supply Quote Builder</strong>
      <a href="admin-supply-requests.html" class="small muted">← All Requests</a>
    </header>

    <main class="admin-content" id="q">
      <div class="card" style="padding:40px;text-align:center">Loading live request from Supabase...</div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);
  const root = document.getElementById('q');
  const urlParams = new URLSearchParams(location.search);
  const reqId = urlParams.get('id');

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const num = v => +String(v).replace(/\D/g, '') || 0;

  if (!sb || !reqId) {
    root.innerHTML = '<div class="card" style="text-align:center;padding:40px"><h2>Request ID missing or database offline</h2><p class="muted" style="margin:10px 0 20px">Please return to the requests list and select a valid item.</p><a class="btn" href="admin-supply-requests.html">Back to requests</a></div>';
    return;
  }

  try {
    const { data: request, error } = await sb.from('supply_requests').select('*').eq('id', reqId).single();
    if (error || !request) throw (error || new Error('Request not found'));

    root.innerHTML = `
      <div class="row-between" style="margin-bottom:16px">
        <h1>Request #${request.id} · ${request.business_name || 'Client'}</h1>
        <a class="muted" href="admin-supply-requests.html">← All requests</a>
      </div>
      <div class="card stack" style="gap:4px;margin-bottom:20px">
        <span><strong>Client Notes / Details:</strong> ${request.details || 'Standard bulk supply order'}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item / Description</th><th>Qty</th><th>Unit Price (₦)</th><th>Total</th></tr></thead>
          <tbody>
            <tr>
              <td>Bulk Supply Order #${request.id}</td>
              <td>${request.quantity || 1}</td>
              <td><input class="sel" style="width:130px;border-radius:var(--r-sm)" id="unit-price" value="${request.estimated_price || 0}" inputmode="numeric"></td>
              <td id="line-total">₦0</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card stack" style="margin-top:20px">
        <div class="form-grid">
          <div class="field"><label for="disc">Discount (₦)</label><input id="disc" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label for="del">Delivery fee (₦)</label><input id="del" inputmode="numeric" placeholder="0"></div>
          <div class="field full"><label for="valid">Valid Until</label><input id="valid" type="date"></div>
        </div>
        <div class="line" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border)"><span>Subtotal</span><strong id="sub">₦0</strong></div>
        <div class="line total" style="display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:1.05rem"><span>Quote Total</span><span id="tot">₦0</span></div>
        <p class="form-msg" id="msg"></p>
        <div class="btn-row" style="margin:0">
          <button class="btn" id="send" type="button">Send quote to database</button>
          <button class="btn outline" id="draft" type="button">Save draft</button>
        </div>
      </div>`;

    const qty = request.quantity || 1;
    function calc() {
      const price = num(document.getElementById('unit-price').value);
      const sub = qty * price;
      document.getElementById('line-total').textContent = naira(sub);
      const disc = num(document.getElementById('disc').value);
      const del = num(document.getElementById('del').value);
      const total = Math.max(0, sub - disc + del);
      document.getElementById('sub').textContent = naira(sub);
      document.getElementById('tot').textContent = naira(total);
      return total;
    }

    root.addEventListener('input', calc);
    calc();

    document.getElementById('draft').onclick = () => toast('Draft saved locally');

    document.getElementById('send').onclick = async () => {
      const validDate = document.getElementById('valid').value;
      if (!validDate) { document.getElementById('msg').textContent = 'Please choose a "valid until" expiration date.'; return; }
      
      const finalTotal = calc();
      
      const { error: updateErr } = await sb.from('supply_requests').update({ 
        status: 'Quoted', 
        total_amount: finalTotal,
        valid_until: validDate
      }).eq('id', reqId);

      if (updateErr) {
        console.error(updateErr);
        toast('Failed to update quote in Supabase.');
        return;
      }

      toast('Quote successfully sent and updated!');
      setTimeout(() => location.href = 'admin-supply-requests.html', 900);
    };

  } catch (err) {
    console.error('Error loading request from DB:', err);
    root.innerHTML = '<div class="card" style="text-align:center;padding:40px"><h2>Failed to load supply request details.</h2><p class="muted" style="margin:10px 0 20px">Make sure the request exists in your database.</p><a class="btn" href="admin-supply-requests.html">Back to requests</a></div>';
  }
});
</script>
</body>
</html>
