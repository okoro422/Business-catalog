<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Business Catalog Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 1. Load Supabase CDN JS Library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load Configuration SECOND so window.BC_CONFIG exists -->
<script src="./config.js"></script>

<!-- 3. Load your Backend / Supabase logic NEXT -->
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<style>
/* Business Catalog - ONE shared stylesheet for every page */
:root{
  --forest-900:#0F2A1D;--forest-800:#17382A;--forest-700:#1F4D36;--forest-600:#2C6B4A;
  --sage-300:#B9CDB9;--mint-200:#CFE8D5;--mint-100:#E8F5EC;--mint-50:#F3FAF5;
  --cream-50:#FBF8F1;--cream-100:#F5F0E4;--cream-200:#EBE3D0;--white:#fff;
  --ink-900:#1E2321;--ink-700:#3A4140;--ink-500:#6B7370;
  --success:#2E7D4F;--warning:#C98A1B;--danger:#B3402F;
  --bg:var(--cream-50);--surface:#fff;--border:var(--cream-200);
  --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-pill:999px;
  --shadow-1:0 2px 8px rgba(15,42,29,.08);--shadow-2:0 6px 18px rgba(15,42,29,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:14px;color:var(--ink-700);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;line-height:1.5}
a{color:inherit;text-decoration:none}
h1{font-family:var(--font-display);color:var(--ink-900);font-size:clamp(1.5rem,3vw,1.9rem)}
.muted{color:var(--ink-500)}.small{font-size:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:var(--r-pill);z-index:200;font-size:13px;box-shadow:var(--shadow-2)}

/* Admin Shell Layout */
body.admin-body{flex-direction:row}
.admin-side{display:none;width:250px;flex-shrink:0;background:var(--forest-900);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-side .brand{color:#fff;display:block;padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.admin-side nav{display:flex;flex-direction:column;gap:2px;padding:14px 0}
.admin-side nav a{display:flex;justify-content:space-between;padding:12px 24px;color:var(--sage-300);font-weight:500}
.admin-side nav a:hover,.admin-side nav a.active{background:var(--forest-800);color:#fff}
.admin-side nav a.active{border-left:4px solid var(--mint-200);padding-left:20px}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);gap:12px}
.admin-content{padding:20px 16px 90px;max-width:1150px;width:100%;display:flex;flex-direction:column;gap:20px}

/* UI Elements */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.pill{background:var(--cream-100);border:1px solid var(--border);color:var(--ink-500);padding:8px 16px;border-radius:var(--r-pill);font:600 12px var(--font-body);white-space:nowrap;cursor:pointer;transition:.2s}
.pill.active{background:var(--forest-700);border-color:var(--forest-700);color:#fff}
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;text-align:left;min-width:600px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);background:var(--cream-50);padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}tr.clickable:hover{background:var(--mint-50)}
.sel{padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:#fff;font:inherit;color:var(--ink-900);cursor:pointer}
.kanban{display:grid;gap:14px;grid-template-columns:1fr}
.kcol{background:var(--mint-50);border:1px solid var(--mint-200);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.kcol h4{font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--mint-200)}
.kcard{display:block;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow-1)}

@media(min-width:640px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.admin-side{display:block}.admin-top{padding:16px 32px}.admin-content{padding:28px 32px}.kanban{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body data-layout="admin" data-section="orders" data-title="Orders" class="admin-body">

  <aside class="admin-side">
    <a href="admin-dashboard.html" class="brand">Catalog Admin</a>
    <nav>
      <a href="admin-dashboard.html">Dashboard <i class="fa-solid fa-chart-line"></i></a>
      <a href="admin-products.html">Products <i class="fa-solid fa-store"></i></a>
      <a href="admin-orders.html" class="active">Orders <i class="fa-solid fa-box-archive"></i></a>
      <a href="admin-supply-requests.html">Supply <i class="fa-solid fa-file-invoice"></i></a>
      <a href="admin-customers.html">Customers <i class="fa-regular fa-address-book"></i></a>
      <a href="admin-inbox.html">Inbox <i class="fa-regular fa-comment-dots"></i></a>
      <a href="admin-reports.html">Reports <i class="fa-solid fa-chart-column"></i></a>
      <a href="admin-delivery-zones.html">Settings <i class="fa-solid fa-truck"></i></a>
      <a href="index.html" style="margin-top:20px;color:var(--mint-200)">View Store <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <strong>Orders Management</strong>
      <a href="index.html" class="small muted">View Store →</a>
    </header>

    <main class="admin-content" id="main">
      <h1>Orders</h1>
      <div class="pills" id="pills"></div>
      
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Order</th><th>Customer & Phone</th><th>Location</th><th>Total</th><th>Status</th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="muted" style="text-align:center;padding:20px">Loading orders from database...</td></tr>
          </tbody>
        </table>
      </div>

      <h2 style="margin-top:28px">Workflow board</h2>
      <div class="kanban" id="board"></div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id);
  const STATUSES = ['New', 'Confirmed', 'Packed', 'Out for delivery', 'Delivered'];
  let f = 'All';
  let orders = [];

  // Initialize Supabase client
  const sb = (window.BCLive && window.BCLive.sb) || (window.supabase && typeof window.supabase.createClient === 'function' && window.BC_CONFIG ? window.supabase.createClient(window.BC_CONFIG.SUPABASE_URL, window.BC_CONFIG.SUPABASE_ANON_KEY) : null);

  const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }

  // Fetch live orders from Supabase using your actual schema columns
  async function fetchOrders() {
    if (!sb) {
      $('rows').innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center">Database client unavailable.</td></tr>';
      return;
    }
    try {
      const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      orders = data || [];
      render();
    } catch (err) {
      console.error('Error fetching orders:', err);
      $('rows').innerHTML = '<tr><td colspan="5" class="text-danger" style="text-align:center">Failed to load orders from database.</td></tr>';
    }
  }

  // Update order status in Supabase
  async function updateOrderStatus(id, newStatus) {
    if (!sb) return;
    try {
      const { error } = await sb.from('orders').update({ status: newStatus }).eq('id', id);
      if (error) throw error;
      toast('Status updated');
      fetchOrders();
    } catch (err) {
      console.error('Error updating status:', err);
      toast('Failed to update status');
    }
  }

  function render() {
    const all = orders.map(o => ({
      id: o.id,
      customer: o.customer_name || 'Customer',
      phone: o.phone || '',
      area: o.area || '',
      zone: o.zone_code || '',
      total: o.total || 0,
      status: o.status || 'New'
    }));

    // Render filter pills
    const pillCounts = ['All'].concat(STATUSES).map(s => {
      const count = s === 'All' ? all.length : all.filter(o => o.status === s).length;
      return `<button type="button" class="pill ${s === f ? 'active' : ''}" data-f="${s}">${s} ${count}</button>`;
    });
    $('pills').innerHTML = pillCounts.join('');

    // Render table rows
    const filtered = all.filter(o => f === 'All' || o.status === f);
    $('rows').innerHTML = filtered.map(o => `
      <tr class="clickable" data-href="admin-order-details.html?id=${o.id}">
        <td><strong>#${o.id.toString().substring(0, 8)}</strong></td>
        <td><strong>${o.customer}</strong><br><small class="muted">${o.phone}</small></td>
        <td>${o.area} <small class="muted">(${o.zone})</small></td>
        <td>${naira(o.total)}</td>
        <td>
          <select class="sel" data-id="${o.id}" onclick="event.stopPropagation()">
            ${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">No orders found. Your database table is clean.</td></tr>';

    // Render Kanban columns (first 4 statuses)
    const COLS = STATUSES.slice(0, 4);
    $('board').innerHTML = COLS.map(c => {
      const colOrders = all.filter(o => o.status === c);
      return `
        <div class="kcol">
          <h4>${c} (${colOrders.length})</h4>
          ${colOrders.length > 0 ? colOrders.map(o => `
            <a class="kcard" href="admin-order-details.html?id=${o.id}">
              <strong>#${o.id.toString().substring(0, 8)}</strong>
              <div class="small muted">${o.customer} · ${naira(o.total)}</div>
            </a>
          `).join('') : '<span class="small muted">Empty</span>'}
        </div>
      `;
    }).join('');
  }

  // Event Listeners
  $('pills').addEventListener('click', e => { 
    const b = e.target.closest('.pill'); 
    if (b) { f = b.dataset.f; render(); } 
  });

  $('rows').addEventListener('change', e => { 
    const sel = e.target.closest('select'); 
    if (sel) { 
      updateOrderStatus(sel.dataset.id, sel.value); 
    } 
  });

  // Load orders on startup
  fetchOrders();
});
</script>
</body>
</html>
